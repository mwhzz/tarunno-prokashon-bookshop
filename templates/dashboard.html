{% extends 'base.html' %}
{% block page_title %}ড্যাশবোর্ড{% endblock %}

{% block extra_css %}
<style>
#dash {
  --dv-bg: #F8FAF9;
  --dv-card: #FFFFFF;
  --dv-primary: #157347;
  --dv-primary-dark: #146C43;
  --dv-primary-soft: #E7F5EE;
  --dv-border: #E5E7EB;
  --dv-text: #111827;
  --dv-text2: #6B7280;
  --dv-danger: #DC2626;
  --dv-danger-soft: #FEE2E2;
  --dv-warning: #F59E0B;
  --dv-warning-soft: #FEF3C7;
  --dv-blue: #2563EB;
  --dv-blue-soft: #DBEAFE;
  --dv-success: #16A34A;
  --dv-radius: 12px;
  --dv-shadow: 0 2px 8px rgba(0,0,0,.04);
  max-width: 1600px;
  margin: 0 auto;
  color: var(--dv-text);
  animation: fadeUp .35s ease both;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

#dash .dv-grid { display: flex; flex-direction: column; gap: 24px; }

#dash .dv-card {
  background: var(--dv-card);
  border: 1px solid var(--dv-border);
  border-radius: var(--dv-radius);
  box-shadow: var(--dv-shadow);
  padding: 24px;
}

#dash .dv-card-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; gap: 12px;
}
#dash .dv-card-head h3 { font-size: 15px; font-weight: 600; color: var(--dv-text); }

#dash .dv-link {
  font-size: 13px; font-weight: 600; color: var(--dv-primary);
  text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
}
#dash .dv-link:hover { color: var(--dv-primary-dark); }
#dash .dv-link.block { margin-top: 14px; justify-content: center; width: 100%; }

/* ── Stat cards (top row) ── */
#dash .dv-stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
#dash .dv-stat {
  background: var(--dv-card); border: 1px solid var(--dv-border); border-radius: var(--dv-radius);
  padding: 20px; box-shadow: var(--dv-shadow); min-height: 110px;
  display: flex; flex-direction: column; justify-content: space-between;
  transition: transform .2s ease, box-shadow .2s ease;
}
#dash .dv-stat:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.07); }
#dash .dv-stat-top { display: flex; align-items: center; justify-content: space-between; }
#dash .dv-stat-label { font-size: 13px; font-weight: 500; color: var(--dv-text2); }
#dash .dv-stat-icon {
  width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0;
}
#dash .dv-stat-value {
  font-family: 'JetBrains Mono', monospace; font-size: 27px; font-weight: 700; color: var(--dv-text);
  margin-top: 10px; line-height: 1.1;
}
#dash .dv-stat-delta { font-size: 13.5px; font-weight: 600; margin-top: 8px; display: flex; align-items: center; gap: 5px; }
#dash .dv-stat-delta.up { color: var(--dv-success); }
#dash .dv-stat-delta.down { color: var(--dv-danger); }
#dash .dv-stat-delta small { color: var(--dv-text2); font-weight: 500; }
#dash .dv-stat-delta.neutral small { color: var(--dv-text2); }

/* ── Quick actions ── */
#dash .dv-section-title { font-size: 13px; font-weight: 700; color: var(--dv-text2); text-transform: uppercase; letter-spacing: .04em; }
#dash .dv-qa-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 14px; }
#dash .dv-qa-btn {
  height: 56px; border-radius: 10px; border: 1px solid var(--dv-border); background: #fff; color: var(--dv-text);
  display: flex; align-items: center; justify-content: center; gap: 9px; font-weight: 600; font-size: 14px;
  text-decoration: none; transition: transform .2s ease, background .2s ease, border-color .2s ease;
}
#dash .dv-qa-btn:hover { border-color: var(--dv-primary); background: var(--dv-primary-soft); transform: translateY(-2px); }
#dash .dv-qa-btn.primary { background: var(--dv-primary); color: #fff; border-color: var(--dv-primary); }
#dash .dv-qa-btn.primary:hover { background: var(--dv-primary-dark); }
#dash .dv-qa-btn svg { flex-shrink: 0; }

/* ── Main + side layout ── */
#dash .dv-main-row { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; align-items: start; }
#dash .dv-main-col { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
#dash .dv-side-col { display: flex; flex-direction: column; gap: 24px; }
#dash .dv-chart-row { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }

/* ── Bar chart ── */
#dash .dv-chart-card { min-height: 340px; display: flex; flex-direction: column; }
#dash .dv-select {
  display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--dv-text2);
  border: 1px solid var(--dv-border); border-radius: 8px; padding: 6px 10px; cursor: default;
}
#dash .dv-bars {
  flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; gap: 14px; min-height: 240px;
}
#dash .dv-bar-col { display: flex; flex-direction: column; align-items: center; gap: 10px; height: 100%; justify-content: flex-end; }
#dash .dv-bar-track { display: flex; align-items: flex-end; height: 220px; }
#dash .dv-bar-fill {
  width: 34px; border-radius: 7px 7px 3px 3px; background: var(--dv-primary); min-height: 4px;
  transition: height .5s ease; cursor: default;
}
#dash .dv-bar-fill:hover { background: var(--dv-primary-dark); }
#dash .dv-bar-lbl { font-size: 13px; font-weight: 600; color: var(--dv-text2); }

/* ── Donut ── */
#dash .dv-donut-card { min-height: 340px; display: flex; flex-direction: column; }
#dash .dv-donut-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
#dash .dv-donut { width: 150px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; }
#dash .dv-donut-hole {
  width: 96px; aspect-ratio: 1; border-radius: 50%; background: #fff; display: grid; place-items: center; text-align: center;
}
#dash .dv-donut-hole strong { display: block; font-family: 'JetBrains Mono', monospace; font-size: 23px; font-weight: 700; color: var(--dv-text); }
#dash .dv-donut-hole small { font-size: 12.5px; color: var(--dv-text2); font-weight: 600; }
#dash .dv-donut-legend { display: flex; flex-direction: column; gap: 8px; width: 100%; }
#dash .dv-leg { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--dv-text); }
#dash .dv-leg .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

/* ── Recent sales table ── */
#dash .dv-table-card { padding: 24px 0 0; }
#dash .dv-table-card .dv-card-head { padding: 0 24px; }
#dash .dv-table-scroll { max-height: 350px; overflow-y: auto; margin-top: 12px; }
#dash table.dv-table { width: 100%; border-collapse: collapse; }
#dash table.dv-table thead th {
  position: sticky; top: 0; background: var(--dv-bg); z-index: 1;
  font-size: 12.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--dv-text2);
  padding: 12px 24px; border-bottom: 1px solid var(--dv-border); text-align: left; white-space: nowrap;
}
#dash table.dv-table tbody td {
  padding: 0 24px; height: 60px; font-size: 13.5px; color: var(--dv-text); border-bottom: 1px solid #F3F4F6; vertical-align: middle;
}
#dash table.dv-table tbody tr:hover td { background: var(--dv-primary-soft); }
#dash table.dv-table tbody tr:last-child td { border-bottom: none; }
#dash .dv-empty-row { text-align: center; color: var(--dv-text2); height: 100px !important; }

#dash .dv-badge {
  display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 99px; font-size: 13px; font-weight: 700;
}
#dash .dv-badge.green { background: #DCFCE7; color: var(--dv-success); }
#dash .dv-badge.red   { background: var(--dv-danger-soft); color: var(--dv-danger); }

/* ── Right rail rows ── */
#dash .dv-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #F3F4F6; font-size: 13.5px; }
#dash .dv-row:last-of-type { border-bottom: none; }
#dash .dv-row span { color: var(--dv-text2); }
#dash .dv-row strong { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--dv-text); }
#dash .dv-row strong.ok { color: var(--dv-success); }
#dash .dv-row strong.bad { color: var(--dv-danger); }
#dash .dv-row.sub span, #dash .dv-row.sub strong { font-size: 13.5px; }

#dash .dv-progress { height: 7px; background: #F3F4F6; border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
#dash .dv-progress-fill { height: 100%; border-radius: 99px; background: var(--dv-success); transition: width .5s ease; }

#dash .dv-task {
  display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #F3F4F6;
  text-decoration: none; color: inherit; transition: opacity .15s ease;
}
#dash .dv-task:last-child { border-bottom: none; }
#dash .dv-task:hover { opacity: .7; }
#dash .dv-task-icon {
  width: 36px; height: 36px; border-radius: 9px; background: var(--dv-primary-soft); color: var(--dv-primary);
  display: grid; place-items: center; flex-shrink: 0;
}
#dash .dv-task-icon.warn { background: var(--dv-warning-soft); color: var(--dv-warning); }
#dash .dv-task strong { display: block; font-size: 13.5px; font-weight: 600; color: var(--dv-text); }
#dash .dv-task small { font-size: 13px; color: var(--dv-text2); }

/* ── Monthly summary ── */
#dash .dv-month-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
#dash .dv-month-card {
  padding: 18px 16px; background: var(--dv-bg); border: 1px solid var(--dv-border); border-radius: 10px; text-align: center;
}
#dash .dv-month-card .dv-stat-label { text-transform: uppercase; letter-spacing: .04em; font-size: 12.5px; font-weight: 700; }
#dash .dv-month-card .dv-stat-value { font-size: 22px; margin-top: 8px; }
#dash .dv-month-card .dv-stat-delta { justify-content: center; }

/* ── Empty state ── */
#dash .dv-empty { text-align: center; padding: 50px 20px; color: var(--dv-text2); }
#dash .dv-empty .dv-empty-icon { font-size: 40px; margin-bottom: 10px; opacity: .5; }

/* ── Responsive ── */
@media (max-width: 1280px) {
  #dash .dv-main-row { grid-template-columns: 1fr; }
  #dash .dv-side-col { display: grid; grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 1024px) {
  #dash .dv-stats-row { grid-template-columns: repeat(2, 1fr); }
  #dash .dv-chart-row { grid-template-columns: 1fr; }
  #dash .dv-month-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 768px) {
  #dash .dv-qa-row { grid-template-columns: repeat(2, 1fr); }
  #dash .dv-side-col { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  #dash .dv-stats-row, #dash .dv-month-grid { grid-template-columns: 1fr; }
}

/* Skeleton loading state — mirrors the real layout instead of a blank spinner */
@keyframes dvShimmer { 0% { opacity: .5; } 50% { opacity: .9; } 100% { opacity: .5; } }
#dash .dv-skel { animation: dvShimmer 1.3s ease-in-out infinite; }
#dash .dv-skel-stat { height: 110px; border-radius: var(--dv-radius); background: var(--dv-border); }
#dash .dv-skel-row { height: 56px; border-radius: 10px; background: var(--dv-border); }
#dash .dv-skel-block { border-radius: var(--dv-radius); background: var(--dv-border); }
</style>
{% endblock %}

{% block content %}
<div id="dash">
  <div class="dv-grid">
    <div class="dv-stats-row">
      <div class="dv-skel dv-skel-stat"></div>
      <div class="dv-skel dv-skel-stat"></div>
      <div class="dv-skel dv-skel-stat"></div>
      <div class="dv-skel dv-skel-stat"></div>
    </div>
    <div class="dv-skel dv-skel-row"></div>
    <div class="dv-skel dv-skel-block" style="height:340px"></div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
/* ── Icon set (Lucide-style inline SVG, 1.8 stroke, 20px default) ── */
const DV_ICON = {
  sales:   '<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  profit:  '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
  due:     '<rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/>',
  inventory: '<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.73Z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/>',
  cart:    '<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>',
  bookPlus: '<path d="M4 19.5V4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 0 4 22"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20"/><path d="M9 7h6M12 4v6"/>',
  packagePlus: '<path d="M16 16h6M19 13v6"/><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l1.5-.86"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/>',
  chart:   '<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  alert:   '<path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  arrow:   '<line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/>',
  chevDown: '<polyline points="6 9 12 15 18 9"/>',
};
function dvSvg(name, size) {
  size = size || 20;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${DV_ICON[name] || ''}</svg>`;
}

const DAY_PARTS = ['সকাল', 'দুপুর', 'বিকাল', 'সন্ধ্যা', 'রাত'];
function dayPartOf(dateObj) {
  const h = dateObj.getHours();
  if (h >= 6 && h < 12) return 'সকাল';
  if (h >= 12 && h < 16) return 'দুপুর';
  if (h >= 16 && h < 18) return 'বিকাল';
  if (h >= 18 && h < 21) return 'সন্ধ্যা';
  return 'রাত';
}
function bucketByDayPart(sales) {
  const buckets = Object.fromEntries(DAY_PARTS.map(p => [p, 0]));
  (sales || []).forEach(s => { buckets[dayPartOf(new Date(s.created_at))] += Number(s.total) || 0; });
  return DAY_PARTS.map(p => ({ label: p, value: buckets[p] }));
}

function dvDelta(curr, prev) {
  curr = Number(curr) || 0; prev = Number(prev) || 0;
  if (!prev) return null;
  const pct = ((curr - prev) / prev) * 100;
  return { pct: Math.abs(pct).toFixed(1), up: pct >= 0 };
}
function isoDate(d) { return d.toISOString().slice(0, 10); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function firstOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function lastMonthRange(d) {
  const lastPrevEnd = addDays(firstOfMonth(d), -1);
  return [firstOfMonth(lastPrevEnd), lastPrevEnd];
}

function itemsSummary(items) {
  if (!items || !items.length) return '—';
  const shown = items.slice(0, 2).map(i => `${i.book_title} ×${i.quantity}`).join(', ');
  const extra = items.length - 2;
  return extra > 0 ? `${shown} +${extra}` : shown;
}
const METHOD_MAP = {
  cash:   ['নগদ', '#DCFCE7', '#16A34A'],
  bank:   ['ব্যাংক', '#DBEAFE', '#2563EB'],
  mobile: ['মোবাইল', '#FEF3C7', '#B45309'],
  credit: ['বাকি', '#FEE2E2', '#DC2626'],
};
function methodBadge(method) {
  const [label, bg, color] = METHOD_MAP[method] || [method || '—', '#F3F4F6', '#6B7280'];
  return `<span class="dv-badge" style="background:${bg};color:${color}">${label}</span>`;
}
function fmtTime(ts) { return new Date(ts).toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' }); }

function statCard(opts) {
  let deltaHtml = '';
  if (opts.deltaObj) {
    const good = opts.invert ? !opts.deltaObj.up : opts.deltaObj.up;
    deltaHtml = `<div class="dv-stat-delta ${good ? 'up' : 'down'}">${opts.deltaObj.up ? '▲' : '▼'} ${opts.deltaObj.pct}% <small>${opts.deltaSuffix}</small></div>`;
  } else if (opts.sub) {
    deltaHtml = `<div class="dv-stat-delta neutral"><small>${opts.sub}</small></div>`;
  }
  return `
    <div class="dv-stat">
      <div class="dv-stat-top">
        <span class="dv-stat-label">${opts.label}</span>
        <span class="dv-stat-icon" style="background:${opts.iconBg};color:${opts.iconColor}">${dvSvg(opts.icon)}</span>
      </div>
      <div>
        <div class="dv-stat-value">৳${num(opts.value)}</div>
        ${deltaHtml}
      </div>
    </div>`;
}

function monthCard(label, value, deltaObj, color, invert) {
  let deltaHtml = '';
  if (deltaObj) {
    const good = invert ? !deltaObj.up : deltaObj.up;
    deltaHtml = `<div class="dv-stat-delta ${good ? 'up' : 'down'}">${deltaObj.up ? '▲' : '▼'} ${deltaObj.pct}% <small>আগের মাস থেকে</small></div>`;
  }
  return `
    <div class="dv-month-card">
      <div class="dv-stat-label">${label}</div>
      <div class="dv-stat-value" style="color:${color}">৳${num(value)}</div>
      ${deltaHtml}
    </div>`;
}

async function loadDash() {
  const root = document.getElementById('dash');
  try {
    const today = new Date();
    const todayISO = isoDate(today);
    const yestISO = isoDate(addDays(today, -1));
    const monthStartISO = isoDate(firstOfMonth(today));
    const [lmStart, lmEnd] = lastMonthRange(today);
    const lmStartISO = isoDate(lmStart), lmEndISO = isoDate(lmEnd);

    const [d, s, recentRes, todayRes, purchMonth] = await Promise.all([
      api('/sales/dashboard/'),
      api('/stock/summary/report/'),
      api('/sales/?page_size=6'),
      api(`/sales/?date_from=${todayISO}&date_to=${todayISO}&page_size=1000`),
      api(`/purchase/bills/summary/?date_from=${monthStartISO}&date_to=${todayISO}`),
    ]);

    const [yestR, lmSalesR, lmPurchR] = await Promise.allSettled([
      api(`/sales/reports/summary/?period=custom&date_from=${yestISO}&date_to=${yestISO}`),
      api(`/sales/reports/summary/?period=custom&date_from=${lmStartISO}&date_to=${lmEndISO}`),
      api(`/purchase/bills/summary/?date_from=${lmStartISO}&date_to=${lmEndISO}`),
    ]);
    const yest = yestR.status === 'fulfilled' ? yestR.value.summary : null;
    const lmSales = lmSalesR.status === 'fulfilled' ? lmSalesR.value.summary : null;
    const lmPurch = lmPurchR.status === 'fulfilled' ? lmPurchR.value : null;

    const t = d.today || {}, m = d.this_month || {};
    const recentSales = recentRes.results || [];
    const todaySales = todayRes.results || [];
    const bars = bucketByDayPart(todaySales);
    const maxBar = Math.max(1, ...bars.map(b => b.value));
    const hasTodaySales = todaySales.length > 0;

    const profitPct = t.total_revenue ? Math.min(100, Math.round((t.realized_profit / t.total_revenue) * 100)) : 0;
    const donutDeg = Math.round((profitPct / 100) * 360);
    const costPortion = Math.max(0, (Number(t.total_revenue) || 0) - (Number(t.realized_profit) || 0));

    const stockNormal = Math.max(0, (s.total_book_types || 0) - (s.out_of_stock_count || 0));
    const stockHealthPct = s.total_book_types ? Math.round((stockNormal / s.total_book_types) * 100) : 0;

    const dueCustomers = (d.stats && d.stats.top_due_customers) || [];

    root.innerHTML = `
      <div class="dv-grid">

        <!-- TOP STATS -->
        <div class="dv-stats-row">
          ${statCard({
            icon: 'sales', iconBg: 'var(--dv-primary-soft)', iconColor: 'var(--dv-primary)',
            label: 'আজকের মোট বিক্রয়', value: t.total_revenue,
            deltaObj: yest ? dvDelta(t.total_revenue, yest.total_revenue) : null, deltaSuffix: 'গতকাল থেকে',
          })}
          ${statCard({
            icon: 'profit', iconBg: 'var(--dv-blue-soft)', iconColor: 'var(--dv-blue)',
            label: 'আজকের লাভ', value: t.realized_profit,
            deltaObj: yest ? dvDelta(t.realized_profit, yest.realized_profit) : null, deltaSuffix: 'গতকাল থেকে',
          })}
          ${statCard({
            icon: 'due', iconBg: 'var(--dv-danger-soft)', iconColor: 'var(--dv-danger)',
            label: 'মোট বাকি', value: t.total_due, invert: true,
            deltaObj: yest ? dvDelta(t.total_due, yest.total_due) : null, deltaSuffix: 'গতকাল থেকে',
          })}
          ${statCard({
            icon: 'inventory', iconBg: 'var(--dv-blue-soft)', iconColor: 'var(--dv-blue)',
            label: 'ইনভেন্টরির মূল্য', value: s.total_stock_value,
            sub: `মোট ${num(s.total_book_types)} ধরনের বই`,
          })}
        </div>

        <!-- QUICK ACTIONS -->
        <div class="dv-card">
          <div class="dv-section-title">দ্রুত কাজ করুন</div>
          <div class="dv-qa-row">
            <a href="/pos/" class="dv-qa-btn primary">${dvSvg('cart')} নতুন বিক্রয় (POS)</a>
            <a href="/books/add/" class="dv-qa-btn">${dvSvg('bookPlus')} নতুন বই যোগ</a>
            <a href="/stock/add/" class="dv-qa-btn">${dvSvg('packagePlus')} স্টক বাড়ান</a>
            <a href="/reports/" class="dv-qa-btn">${dvSvg('chart')} রিপোর্ট দেখুন</a>
          </div>
        </div>

        <!-- MAIN + SIDE -->
        <div class="dv-main-row">
          <div class="dv-main-col">

            <div class="dv-chart-row">
              <div class="dv-card dv-chart-card">
                <div class="dv-card-head">
                  <h3>আজকের বিক্রয় চার্ট</h3>
                  <div class="dv-select">আজ ${dvSvg('chevDown', 14)}</div>
                </div>
                ${hasTodaySales ? `
                  <div class="dv-bars">
                    ${bars.map(b => `
                      <div class="dv-bar-col">
                        <div class="dv-bar-track">
                          <div class="dv-bar-fill" style="height:${Math.max(4, (b.value / maxBar) * 220)}px" title="${b.label}: ৳${num(b.value)}"></div>
                        </div>
                        <div class="dv-bar-lbl">${b.label}</div>
                      </div>`).join('')}
                  </div>` : `
                  <div class="dv-empty">
                    <div class="dv-empty-icon">📊</div>
                    <div>আজ এখনো কোনো বিক্রয় হয়নি</div>
                  </div>`}
              </div>

              <div class="dv-card dv-donut-card">
                <div class="dv-card-head"><h3>লাভের হার</h3></div>
                <div class="dv-donut-wrap">
                  <div class="dv-donut" style="background:conic-gradient(var(--dv-success) 0deg ${donutDeg}deg, #EEF2F1 ${donutDeg}deg 360deg)">
                    <div class="dv-donut-hole"><strong>${profitPct}%</strong><small>লাভ</small></div>
                  </div>
                  <div class="dv-donut-legend">
                    <div class="dv-leg"><span class="dot" style="background:var(--dv-success)"></span>লাভ ৳${num(t.realized_profit)} (${profitPct}%)</div>
                    <div class="dv-leg"><span class="dot" style="background:#EEF2F1;border:1px solid var(--dv-border)"></span>খরচ ৳${num(costPortion)} (${100 - profitPct}%)</div>
                  </div>
                </div>
              </div>
            </div>

            <div class="dv-card dv-table-card">
              <div class="dv-card-head">
                <h3>সাম্প্রতিক বিক্রয়</h3>
                <a href="/sales/" class="dv-link">সব দেখুন ${dvSvg('arrow', 14)}</a>
              </div>
              <div class="dv-table-scroll">
                <table class="dv-table">
                  <thead>
                    <tr><th>ইনভয়েস</th><th>গ্রাহক</th><th>পণ্য</th><th>মোট</th><th>মেথড</th><th>সময়</th></tr>
                  </thead>
                  <tbody>
                    ${recentSales.length ? recentSales.map(sale => `
                      <tr>
                        <td style="font-family:'JetBrains Mono',monospace">${sale.invoice_number}</td>
                        <td>${sale.customer_name}</td>
                        <td style="color:var(--dv-text2)">${itemsSummary(sale.items)}</td>
                        <td style="font-family:'JetBrains Mono',monospace;font-weight:700">৳${num(sale.total)}</td>
                        <td>${methodBadge(sale.payment_method)}</td>
                        <td style="color:var(--dv-text2)">${fmtTime(sale.created_at)}</td>
                      </tr>`).join('') : `<tr><td colspan="6" class="dv-empty-row">এখনো কোনো বিক্রয় নেই</td></tr>`}
                  </tbody>
                </table>
              </div>
            </div>

          </div>

          <div class="dv-side-col">

            <div class="dv-card">
              <div class="dv-card-head"><h3>📦 স্টক অবস্থা</h3><span class="dv-badge green">${stockHealthPct}%</span></div>
              <div class="dv-progress"><div class="dv-progress-fill" style="width:${stockHealthPct}%"></div></div>
              <div class="dv-row"><span>মোট আইটেম</span><strong>${num(s.total_book_types)}</strong></div>
              <div class="dv-row"><span>স্বাভাবিক স্টক</span><strong class="ok">${num(stockNormal)}</strong></div>
              <div class="dv-row"><span>স্টক নেই</span><strong class="bad">${num(s.out_of_stock_count)}</strong></div>
            </div>

            <div class="dv-card">
              <div class="dv-card-head"><h3>⚠️ বাকির অবস্থা</h3><span class="dv-badge red">${d.due_invoices || 0}টি বিল</span></div>
              <div class="dv-row"><span>আজকের নতুন বাকি</span><strong class="bad">৳${num(t.total_due)}</strong></div>
              ${dueCustomers.slice(0, 3).map(c => `
                <div class="dv-row sub"><span>${c.name}</span><strong>৳${num(c.due)}</strong></div>`).join('')}
              <a href="/sales/due/" class="dv-link block">সব বাকি দেখুন ${dvSvg('arrow', 14)}</a>
            </div>

            <div class="dv-card">
              <div class="dv-card-head"><h3>🚀 আজ যে কাজগুলো করতে পারেন</h3></div>
              <a href="/pos/" class="dv-task">
                <span class="dv-task-icon">${dvSvg('cart', 18)}</span>
                <div><strong>বিক্রয় শুরু করুন</strong><small>POS খুলুন</small></div>
              </a>
              <a href="/sales/due/" class="dv-task">
                <span class="dv-task-icon warn">${dvSvg('alert', 18)}</span>
                <div><strong>বাকি আদায় করুন</strong><small>৳${num(t.total_due)} আজকের বাকি</small></div>
              </a>
              <a href="/reports/" class="dv-task">
                <span class="dv-task-icon">${dvSvg('chart', 18)}</span>
                <div><strong>রিপোর্ট দেখুন</strong><small>লাভ-ক্ষতি বিশ্লেষণ</small></div>
              </a>
            </div>

          </div>
        </div>

        <!-- MONTHLY SUMMARY -->
        <div class="dv-card">
          <div class="dv-card-head"><h3>মাসিক সারাংশ (এই মাস)</h3></div>
          <div class="dv-month-grid">
            ${monthCard('মোট বিক্রয়', m.total_revenue, lmSales ? dvDelta(m.total_revenue, lmSales.total_revenue) : null, 'var(--dv-success)')}
            ${monthCard('মোট লাভ', m.realized_profit, lmSales ? dvDelta(m.realized_profit, lmSales.realized_profit) : null, 'var(--dv-blue)')}
            ${monthCard('মোট বাকি', m.total_due, lmSales ? dvDelta(m.total_due, lmSales.total_due) : null, 'var(--dv-danger)', true)}
            ${monthCard('মোট ক্রয়', purchMonth.total_price, lmPurch ? dvDelta(purchMonth.total_price, lmPurch.total_price) : null, 'var(--dv-text)')}
          </div>
        </div>

      </div>`;

  } catch (e) {
    root.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><h3>ডাটা লোড হয়নি</h3><p>সার্ভার চালু আছে কিনা দেখুন।</p></div>`;
    console.error(e);
  }
}
document.addEventListener('DOMContentLoaded', loadDash);
</script>
{% endblock %}
