{% extends 'base.html' %}

{% block page_title %}বাকি বিল{% endblock %}

{% block content %}
<!--
=============================================================================
* বাকি বিলের তালিকা (Due Invoices)
* যেসব ইনভয়েসে কাস্টমার পুরো টাকা দেয়নি (বাকি আছে), সেগুলো এখানে দেখা যাবে।
=============================================================================
-->

<div id="due-wrapper">
    <div class="loading"><div class="spinner"></div> লোড হচ্ছে...</div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function initDue() {
  const w = document.getElementById('due-wrapper');
  try {
    // API থেকে দুই ধরনের বাকি আসছে: (১) নির্দিষ্ট ইনভয়েসের বাকি, (২) গ্রাহকের এমন বাকি
    // যা কোনো ইনভয়েসের সাথে যুক্ত নয় (যেমন গ্রাহক যোগ করার সময়ের ওপেনিং ব্যালেন্স)
    const r = await api('/sales/due_list/');
    const invoices     = r.invoices || [];
    const customerDues = r.customer_dues || [];

    // মোট কত টাকা বাকি আছে তার হিসাব (দুই ধরন মিলিয়ে)
    const invoiceDueTotal = invoices.reduce((sum, item) => sum + parseFloat(item.due_amount), 0);
    const otherDueTotal   = customerDues.reduce((sum, item) => sum + parseFloat(item.amount), 0);
    const totalDue        = invoiceDueTotal + otherDueTotal;

    w.innerHTML = `
      <div class="stat-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px;">
        <div class="stat-card red">
            <div class="stat-label">মোট বাকি বিল (Total Due Invoices)</div>
            <div class="stat-value">${invoices.length}টি</div>
        </div>
        <div class="stat-card red">
            <div class="stat-label">মোট বাকি পরিমাণ (Total Due Amount)</div>
            <div class="stat-value">৳${num(totalDue)}</div>
        </div>
      </div>

      <div class="table-wrap">
        <div class="table-header">
            <span class="table-title">${icon('alert-triangle', 15)} বাকি ইনভয়েসের তালিকা</span>
        </div>
        <table style="width:100%; border-collapse:collapse;">
          <thead>
            <tr>
                <th>ইনভয়েস নম্বর</th>
                <th>গ্রাহক</th>
                <th>ফোন</th>
                <th>মোট বিল</th>
                <th>বাকি পরিমাণ</th>
                <th>স্ট্যাটাস</th>
                <th>তারিখ</th>
                <th>অ্যাকশন</th>
            </tr>
          </thead>
          <tbody>
            ${invoices.length ? invoices.map(s => `<tr>
              <td style="font-family:monospace"><strong>${s.invoice_number}</strong></td>
              <td><strong>${s.customer_name}</strong></td>
              <td style="color:var(--muted)">${s.customer_phone || '—'}</td>
              <td style="font-family:monospace">৳${num(s.total)}</td>
              <td style="font-family:monospace;color:var(--danger);font-weight:700">৳${num(s.due_amount)}</td>
              <td>${statusBadge(s.status)}</td>
              <td style="color:var(--muted);font-size:13px">${fmtDate(s.created_at)}</td>
              <td style="white-space:nowrap">
                <button class="btn btn-success btn-sm" onclick="collectPayment(${s.id}, ${s.due_amount})">
                  ৳ পেমেন্ট নিন
                </button>
                <a class="btn btn-ghost btn-sm" href="/api/sales/${s.id}/print_invoice/" target="_blank" style="text-decoration:none">${icon('printer', 13)} রশিদ</a>
              </td>
            </tr>`).join('') : `<tr><td colspan="8" class="empty">কোনো বাকি ইনভয়েস নেই।</td></tr>`}
          </tbody>
        </table>
      </div>

      ${customerDues.length ? `
      <div class="table-wrap" style="margin-top:20px">
        <div class="table-header">
            <span class="table-title">${icon('alert-triangle', 15)} অন্যান্য বাকি (ইনভয়েসের বাইরে — যেমন ওপেনিং ব্যালেন্স)</span>
        </div>
        <table style="width:100%; border-collapse:collapse;">
          <thead>
            <tr>
                <th>কোড</th>
                <th>গ্রাহক</th>
                <th>ফোন</th>
                <th>বাকি পরিমাণ</th>
                <th>অ্যাকশন</th>
            </tr>
          </thead>
          <tbody>
            ${customerDues.map(c => `<tr>
              <td style="font-family:monospace">${c.customer_code || '—'}</td>
              <td><strong>${c.name}</strong></td>
              <td style="color:var(--muted)">${c.phone || '—'}</td>
              <td style="font-family:monospace;color:var(--danger);font-weight:700">৳${num(c.amount)}</td>
              <td>
                <button class="btn btn-success btn-sm" onclick="collectCustomerDue(${c.id}, ${c.amount})">
                  ৳ পেমেন্ট নিন
                </button>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>` : ''}`;
  } catch(e) {
      w.innerHTML = '<div class="empty">ডাটা লোড করতে সমস্যা হয়েছে।</div>';
  }
}

function updatePayPreview(maxAmount) {
  const amount = parseFloat(document.getElementById('pay-amount')?.value || 0);
  const discount = parseFloat(document.getElementById('pay-discount')?.value || 0);
  const remaining = Math.max(0, maxAmount - amount - discount);
  const el = document.getElementById('pay-remaining');
  if (!el) return;
  el.textContent = `৳${num(remaining)}`;
  el.style.color = remaining <= 0 ? 'var(--accent)' : 'var(--danger)';
}

function closeWithDiscount(maxAmount) {
  const amount = parseFloat(document.getElementById('pay-amount')?.value || 0);
  const discountEl = document.getElementById('pay-discount');
  if (discountEl) discountEl.value = Math.max(0, maxAmount - amount);
  updatePayPreview(maxAmount);
}

async function collectPayment(saleId, maxAmount) {
  let html = `
    <div id="payment-modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000">
      <div class="form-card" style="width:400px; padding:24px">
        <h3 style="margin-bottom:12px; display:flex; align-items:center; gap:8px">${icon('wallet', 18)} বকেয়া পেমেন্ট নিন</h3>
        <p style="font-size:14px; color:var(--muted); margin-bottom:16px">মোট বাকি: <strong>৳${num(maxAmount)}</strong></p>

        <div class="form-group">
          <label>জমার পরিমাণ (Amount)</label>
          <input type="number" id="pay-amount" value="${maxAmount}" max="${maxAmount}" min="0" style="width:100%" oninput="updatePayPreview(${maxAmount})">
        </div>

        <div class="form-group" style="margin-top:12px">
          <label>ছাড় ৳ (ঐচ্ছিক)</label>
          <input type="number" id="pay-discount" value="0" min="0" max="${maxAmount}" style="width:100%" oninput="updatePayPreview(${maxAmount})">
          <p style="font-size:13.5px; color:var(--accent); margin-top:5px; cursor:pointer; text-decoration:underline; text-decoration-style:dashed; display:inline-block;" onclick="closeWithDiscount(${maxAmount})">অবশিষ্টটা ছাড় হিসেবে দিয়ে সম্পূর্ণ ক্লোজ করুন</p>
        </div>

        <div class="form-group" style="margin-top:12px">
          <label>পেমেন্ট মেথড</label>
          <select id="pay-method" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border)">
            <option value="cash">Cash (নগদ)</option>
            <option value="bkash">bKash (বিকাশ)</option>
            <option value="nagad">Nagad (নগদ)</option>
            <option value="bank">Bank (ব্যাংক)</option>
          </select>
        </div>

        <div id="pay-preview" style="font-size:14px; font-weight:700; margin-top:14px; padding:9px 12px; border-radius:8px; background:var(--surface2);">
          পেমেন্টের পর বাকি থাকবে: <span id="pay-remaining" style="color:var(--danger)">৳${num(maxAmount)}</span>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px">
          <button class="btn btn-ghost" onclick="document.getElementById('payment-modal').remove()">বাতিল</button>
          <button class="btn btn-success" id="confirm-pay-btn">পেমেন্ট কনফার্ম</button>
        </div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', html);
  const modalEl = document.getElementById('payment-modal');
  wireModalDismiss(modalEl, () => modalEl.remove());

  document.getElementById('confirm-pay-btn').onclick = async () => {
    const amount = parseFloat(document.getElementById('pay-amount').value || 0);
    const discount = parseFloat(document.getElementById('pay-discount').value || 0);
    const method = document.getElementById('pay-method').value;

    if (amount < 0 || discount < 0) {
      toast('সঠিক পরিমাণ লিখুন', 'error');
      return;
    }
    if (amount + discount <= 0) {
      toast('পরিমাণ অথবা ছাড় — কিছু একটা দিন', 'error');
      return;
    }
    if (amount + discount > maxAmount) {
      toast('পরিমাণ ও ছাড় মিলিয়ে মোট বাকির বেশি হওয়া যাবে না', 'error');
      return;
    }

    try {
      await api(`/sales/${saleId}/add_payment/`, 'POST', { amount, discount, method });
      toast(discount > 0 ? `পেমেন্ট জমা হয়েছে (৳${num(discount)} ছাড়সহ)` : 'পেমেন্ট সফলভাবে জমা হয়েছে');
      modalEl.remove();
      initDue();
    } catch(e) {
      const msg = e && typeof e === 'object' ? (e.error || e.detail || JSON.stringify(e)) : String(e);
      toast('পেমেন্ট জমা নেওয়া যায়নি: ' + msg, 'error');
    }
  };
}

async function collectCustomerDue(customerId, maxAmount) {
  let html = `
    <div id="payment-modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000">
      <div class="form-card" style="width:400px; padding:24px">
        <h3 style="margin-bottom:12px; display:flex; align-items:center; gap:8px">${icon('wallet', 18)} বকেয়া পেমেন্ট নিন</h3>
        <p style="font-size:14px; color:var(--muted); margin-bottom:16px">এই বাকি কোনো নির্দিষ্ট ইনভয়েসের সাথে যুক্ত নয়। মোট বাকি: <strong>৳${num(maxAmount)}</strong></p>

        <div class="form-group">
          <label>জমার পরিমাণ (Amount)</label>
          <input type="number" id="pay-amount" value="${maxAmount}" max="${maxAmount}" min="0" style="width:100%" oninput="updatePayPreview(${maxAmount})">
        </div>

        <div class="form-group" style="margin-top:12px">
          <label>ছাড় ৳ (ঐচ্ছিক)</label>
          <input type="number" id="pay-discount" value="0" min="0" max="${maxAmount}" style="width:100%" oninput="updatePayPreview(${maxAmount})">
          <p style="font-size:13.5px; color:var(--accent); margin-top:5px; cursor:pointer; text-decoration:underline; text-decoration-style:dashed; display:inline-block;" onclick="closeWithDiscount(${maxAmount})">অবশিষ্টটা ছাড় হিসেবে দিয়ে সম্পূর্ণ ক্লোজ করুন</p>
        </div>

        <div id="pay-preview" style="font-size:14px; font-weight:700; margin-top:14px; padding:9px 12px; border-radius:8px; background:var(--surface2);">
          পেমেন্টের পর বাকি থাকবে: <span id="pay-remaining" style="color:var(--danger)">৳${num(maxAmount)}</span>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px">
          <button class="btn btn-ghost" onclick="document.getElementById('payment-modal').remove()">বাতিল</button>
          <button class="btn btn-success" id="confirm-pay-btn">পেমেন্ট কনফার্ম</button>
        </div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', html);
  const modalEl2 = document.getElementById('payment-modal');
  wireModalDismiss(modalEl2, () => modalEl2.remove());

  document.getElementById('confirm-pay-btn').onclick = async () => {
    const amount = parseFloat(document.getElementById('pay-amount').value || 0);
    const discount = parseFloat(document.getElementById('pay-discount').value || 0);

    if (amount < 0 || discount < 0) {
      toast('সঠিক পরিমাণ লিখুন', 'error');
      return;
    }
    if (amount + discount <= 0) {
      toast('পরিমাণ অথবা ছাড় — কিছু একটা দিন', 'error');
      return;
    }
    if (amount + discount > maxAmount) {
      toast('পরিমাণ ও ছাড় মিলিয়ে মোট বাকির বেশি হওয়া যাবে না', 'error');
      return;
    }

    try {
      await api(`/sales/customers/${customerId}/collect_other_due/`, 'POST', { amount, discount });
      toast(discount > 0 ? `পেমেন্ট জমা হয়েছে (৳${num(discount)} ছাড়সহ)` : 'পেমেন্ট সফলভাবে জমা হয়েছে');
      modalEl2.remove();
      initDue();
    } catch(e) {
      const msg = e && typeof e === 'object' ? (e.error || e.detail || JSON.stringify(e)) : String(e);
      toast('পেমেন্ট জমা নেওয়া যায়নি: ' + msg, 'error');
    }
  };
}

document.addEventListener('DOMContentLoaded', initDue);
</script>
{% endblock %}
