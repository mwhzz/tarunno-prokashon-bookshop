<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'Kalpurush';
            src: url('{{ font_path }}');
        }
        @page { size: A4; margin: 1.2cm; }
        body { font-family: 'Kalpurush', sans-serif; font-size: 12px; color: #111; }
        table { width: 100%; border-collapse: collapse; }
        .right { text-align: right; }
        .center { text-align: center; }

        .inv-logo-cell { width: 70px; }
        .inv-logo { width: 55px; height: 55px; }
        .inv-brand { text-align: center; }
        .inv-shop { font-size: 22px; font-weight: bold; }
        .inv-shop-meta { font-size: 12px; }

        .inv-meta { margin-top: 10px; margin-bottom: 4px; font-size: 12px; }

        .inv-box th, .inv-box td, .inv-items th, .inv-items td { border: 1px solid #333; padding: 4px 6px; }
        .inv-box th.lbl { width: 17%; text-align: center; }
        .inv-box td { width: 33%; }

        .inv-items { margin-top: 10px; }
        .inv-items th { text-align: center; }
        .c-sn { width: 6%; } .c-qty { width: 8%; } .c-mrp { width: 10%; } .c-unit { width: 16%; } .c-total { width: 13%; }
        .pct { font-size: 10px; }

        .inv-bottom { margin-top: 10px; font-size: 12px; }
        .inv-due-cell { vertical-align: bottom; }
        .inv-words { margin-top: 12px; font-size: 12px; text-align: center; font-style: italic; }
        .inv-note { margin-top: 6px; font-size: 11px; }
    </style>
</head>
<body>
    {% include 'invoice_sheet.html' %}
</body>
</html>
