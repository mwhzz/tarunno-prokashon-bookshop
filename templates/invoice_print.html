{% load static %}
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice {{ sale.invoice_number }}</title>
  <style>
    @font-face {
      font-family: KalpurushLocal;
      src: url("{% static 'fonts/kalpurush.ttf' %}") format("truetype");
      font-weight: 400;
    }

    * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    body {
      margin: 0;
      background: #eef1f4;
      color: #111;
      font-family: KalpurushLocal, "Noto Sans Bengali", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
    }

    .toolbar { max-width: 210mm; margin: 18px auto 0; display: flex; justify-content: flex-end; gap: 10px; padding: 0 14px; }
    .btn { border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; background: #1f2937; color: #fff; font: 700 14px KalpurushLocal, sans-serif; }
    .btn.secondary { background: #fff; color: #1f2937; border: 1px solid #cbd5e1; }

    .page { width: 210mm; max-width: 100%; margin: 16px auto; background: #fff; padding: 12mm 12mm 14mm; box-shadow: 0 10px 40px rgba(0,0,0,.12); }

    table { width: 100%; border-collapse: collapse; }
    .right { text-align: right; }
    .center { text-align: center; }

    .inv-head td { vertical-align: middle; }
    .inv-logo-cell { width: 70px; }
    .inv-logo { width: 58px; height: 58px; object-fit: contain; }
    .inv-brand { text-align: center; }
    .inv-shop { font-size: 26px; font-weight: 700; }
    .inv-shop-meta { font-size: 14px; }

    .inv-meta { margin: 14px 0 6px; font-size: 15px; }
    .inv-meta td { padding: 2px 0; }

    .inv-box th, .inv-box td, .inv-items th, .inv-items td { border: 1px solid #333; padding: 5px 8px; }
    .inv-box th.lbl { width: 17%; text-align: center; font-weight: 700; }
    .inv-box td { width: 33%; }

    .inv-items { margin-top: 14px; }
    .inv-items th { font-weight: 700; text-align: center; }
    .c-sn { width: 6%; } .c-qty { width: 8%; } .c-mrp { width: 10%; } .c-unit { width: 15%; } .c-total { width: 13%; }
    .pct { font-size: 12px; }

    .inv-bottom { margin-top: 12px; font-size: 15px; }
    .inv-bottom td { vertical-align: bottom; padding: 2px 0; }
    .inv-bottom .right div { padding: 1px 0; }
    .inv-words { margin-top: 14px; font-size: 15px; font-style: italic; text-align: center; }
    .inv-note { margin-top: 8px; font-size: 14px; }

    @page { size: A4; margin: 10mm; }
    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .page { width: auto; margin: 0; padding: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="btn secondary" type="button" onclick="window.close()">বন্ধ করুন</button>
    <button class="btn" type="button" onclick="window.print()">প্রিন্ট করুন</button>
  </div>

  <main class="page">
    {% include 'invoice_sheet.html' %}
  </main>
</body>
</html>
