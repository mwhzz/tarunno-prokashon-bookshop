{% extends 'base.html' %}

{% block page_title %}সব ইনভয়েস{% endblock %}

{% block content %}
<!--
=============================================================================
* সব ইনভয়েস (All Invoices)
* এখানে বিক্রয় হওয়া সব ইনভয়েসের তালিকা দেখা যাবে।
=============================================================================
-->

<div class="table-wrap" style="padding:14px 20px; margin-bottom:16px;">
    <div style="display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap;">
        <div>
            <label style="display:block; font-size:12.5px; font-weight:800; color:var(--muted); margin-bottom:4px;">শুরুর তারিখ</label>
            <input type="date" id="inv-f-from" style="height:36px; padding:0 10px; border:1.5px solid var(--border); border-radius:8px;">
        </div>
        <div>
            <label style="display:block; font-size:12.5px; font-weight:800; color:var(--muted); margin-bottom:4px;">শেষ তারিখ</label>
            <input type="date" id="inv-f-to" style="height:36px; padding:0 10px; border:1.5px solid var(--border); border-radius:8px;">
        </div>
        <div style="flex:1; min-width:220px;">
            <label style="display:block; font-size:12.5px; font-weight:800; color:var(--muted); margin-bottom:4px;">সার্চ (ইনভয়েস নম্বর/গ্রাহক/ফোন)</label>
            <input type="text" id="inv-f-search" placeholder="খুঁজুন..." oninput="debouncedInvoiceLoad()"
                   style="width:100%; height:36px; padding:0 12px; border:1.5px solid var(--border); border-radius:8px;">
        </div>
        <button class="btn btn-primary btn-sm" onclick="initInvoices()">খুঁজুন</button>
        <button class="btn btn-ghost btn-sm" onclick="resetInvoiceFilter()">সব দেখুন</button>
    </div>
</div>

<div id="invoices-wrapper">
    <div class="loading"><div class="spinner"></div> ইনভয়েস লোড হচ্ছে...</div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let invoiceFilterTimer = null;
function debouncedInvoiceLoad() {
  clearTimeout(invoiceFilterTimer);
  invoiceFilterTimer = setTimeout(initInvoices, 350);
}
function resetInvoiceFilter() {
  document.getElementById('inv-f-from').value = '';
  document.getElementById('inv-f-to').value = '';
  document.getElementById('inv-f-search').value = '';
  initInvoices();
}

async function initInvoices() {
  const w = document.getElementById('invoices-wrapper');
  w.innerHTML = '<div class="loading"><div class="spinner"></div> ইনভয়েস লোড হচ্ছে...</div>';
  try {
    const params = new URLSearchParams({ page_size: 150 });
    const from = document.getElementById('inv-f-from').value;
    const to = document.getElementById('inv-f-to').value;
    const q = document.getElementById('inv-f-search').value.trim();
    if (from) params.set('date_from', from);
    if (to) params.set('date_to', to);
    if (q) params.set('search', q);

    const r = await api(`/sales/?${params.toString()}`);

    if (!r.results.length) {
      w.innerHTML = `<div class="empty-state" style="padding:50px 20px;"><div class="empty-icon">🧾</div><h3>কোনো ইনভয়েস পাওয়া যায়নি</h3><p>খোঁজার শর্ত পরিবর্তন করে আবার চেষ্টা করুন।</p></div>`;
      return;
    }

    const truncatedNote = r.count > r.results.length
      ? `<p style="font-size:13px; color:var(--muted); padding:8px 20px 0;">মোট ${num(r.count)}টির মধ্যে সাম্প্রতিক ${r.results.length}টি দেখানো হচ্ছে — নির্দিষ্ট করে খুঁজতে উপরের তারিখ/সার্চ ব্যবহার করুন।</p>`
      : '';

    w.innerHTML = `
      <div class="table-wrap">
        <div class="table-header">
            <span class="table-title">🧾 ইনভয়েসের তালিকা (${r.count}টি)</span>
        </div>
        ${truncatedNote}
        <table style="width:100%; border-collapse:collapse;">
          <thead>
            <tr>
                <th>ইনভয়েস নম্বর</th>
                <th>গ্রাহক</th>
                <th>মোট বিল</th>
                <th>পেমেন্ট পেয়েছি</th>
                <th>বাকি</th>
                <th>স্ট্যাটাস</th>
                <th>তারিখ</th>
                <th>অ্যাকশন</th>
            </tr>
          </thead>
          <tbody>
            ${r.results.map(s => `<tr>
              <td style="font-family:monospace"><strong>${s.invoice_number}</strong></td>
              <td>${s.customer_name}</td>
              <td style="font-family:monospace">৳${num(s.total)}</td>
              <td style="font-family:monospace;color:var(--accent2)">৳${num(s.paid_amount)}</td>
              <td style="font-family:monospace;color:var(--danger)">৳${num(s.due_amount)}</td>
              <td>${statusBadge(s.status)}</td>
              <td style="color:var(--muted);font-size:13px">${fmtDate(s.created_at)}</td>
              <td>
                <div style="display:flex; gap:5px; flex-wrap:wrap;">
                  <a href="/api/sales/${s.id}/print_invoice/" class="btn btn-ghost btn-sm" target="_blank" style="text-decoration:none; color:var(--accent)">
                    ${icon('printer', 13)} প্রিন্ট
                  </a>
                  <button class="btn btn-ghost btn-sm" onclick="showPaymentHistory(${s.id}, '${s.invoice_number}')">
                    ${icon('wallet', 13)} পেমেন্ট
                  </button>
                  <button class="btn btn-ghost btn-sm" onclick="showReturnUI(${s.id}, '${s.invoice_number}')">
                    ${icon('corner-down-left', 13)} ফেরত
                  </button>
                </div>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  } catch(e) {
      w.innerHTML = '<div class="empty-state" style="padding:40px 20px;"><div class="empty-icon">⚠️</div><h3>ডাটা লোড করতে সমস্যা হয়েছে।</h3></div>';
  }
}

async function showPaymentHistory(saleId, invNum) {
  try {
    const s = await api(`/sales/${saleId}/`);
    const payments = s.payments || [];
    let html = `
      <div id="payment-history-modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000">
        <div class="form-card" style="width:460px; padding:20px">
          <h3 style="margin-bottom:6px; display:flex; align-items:center; gap:8px">${icon('wallet', 18)} পেমেন্ট ইতিহাস (#${invNum})</h3>
          <p style="font-size:13px; color:var(--muted); margin-bottom:16px">মোট বিল: <strong>৳${num(s.total)}</strong> • পরিশোধিত: <strong style="color:var(--accent)">৳${num(s.paid_amount)}</strong> • বাকি: <strong style="color:var(--danger)">৳${num(s.due_amount)}</strong></p>
          <div id="payment-history-list">
            ${payments.length ? payments.map(p => `
              <div style="display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px;">
                <span style="color:var(--muted); font-size:12.5px; white-space:nowrap;">${fmtDate(p.created_at)}</span>
                <span style="flex:1; font-weight:700; color:var(--g900);">${p.method_display}${p.discount > 0 ? ` (ছাড় ৳${num(p.discount)})` : ''}</span>
                <span style="font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--accent);">৳${num(p.amount)}</span>
                <button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="deleteInvoicePayment(${saleId}, ${p.id}, '${invNum}')" title="ভুলে দুইবার বসে গেলে মুছুন">${icon('trash', 12)}</button>
              </div>`).join('')
            : `<div class="empty-state" style="padding:24px 10px;"><div class="empty-icon">${icon('wallet', 34)}</div><h3 style="font-size:14px;">এখনো কোনো পেমেন্ট নেই</h3></div>`}
          </div>
          <div style="display:flex; justify-content:flex-end; margin-top:20px">
            <button class="btn btn-ghost" onclick="document.getElementById('payment-history-modal').remove()">বন্ধ করুন</button>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
    const modalEl = document.getElementById('payment-history-modal');
    wireModalDismiss(modalEl, () => modalEl.remove());
  } catch (e) { toast('পেমেন্ট ইতিহাস লোড করা যায়নি', 'error'); }
}

async function deleteInvoicePayment(saleId, paymentId, invNum) {
  const ok = await confirmModal(
    'ভুলে দুইবার বসে যাওয়া পেমেন্ট মুছে ফেলতে চান?\n\nইনভয়েসের পরিশোধিত পরিমাণ, বাকি এবং গ্রাহকের হিসাব — সব আগের অবস্থায় ফিরে যাবে। এই কাজটি বাতিল করা যাবে না।',
    { danger: true, requireText: 'DELETE' }
  );
  if (!ok) return;
  try {
    await api(`/sales/${saleId}/remove_payment/`, 'POST', { payment_id: paymentId });
    toast('পেমেন্ট মুছে ফেলা হয়েছে, হিসাব সংশোধন হয়েছে।');
    document.getElementById('payment-history-modal')?.remove();
    showPaymentHistory(saleId, invNum);
    initInvoices();
  } catch (e) {
    const msg = e && typeof e === 'object' ? (e.error || e.detail || JSON.stringify(e)) : String(e);
    toast('মুছে ফেলা যায়নি: ' + msg, 'error');
  }
}

async function showReturnUI(saleId, invNum) {
  try {
    const s = await api(`/sales/${saleId}/`);
    let html = `
      <div id="return-modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000">
        <div class="form-card" style="width:450px; padding:20px">
          <h3 style="margin-bottom:15px">বই ফেরত নিন (#${invNum})</h3>
          <p style="font-size:13px; color:var(--muted); margin-bottom:15px">যে বইটি ফেরত আসছে তার পরিমাণ লিখুন:</p>
          <div id="return-items-list">
            ${s.items.map(item => `
              <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--border)">
                <div style="flex:1">
                  <div style="font-size:14px; font-weight:600">${item.book_title}</div>
                  <div style="font-size:12.5px; color:var(--muted)">কেনা হয়েছিল: ${item.quantity}টি</div>
                </div>
                <input type="number" class="return-qty" data-id="${item.book}" data-max="${item.quantity}" value="0" min="0" max="${item.quantity}" style="width:60px; padding:4px"
                       oninput="if(Number(this.value)>Number(this.dataset.max))this.value=this.dataset.max; if(Number(this.value)<0)this.value=0;">
              </div>
            `).join('')}
          </div>
          <div class="form-group" style="margin-top:15px">
            <label>ফেরত নেওয়ার কারণ (Reason)</label>
            <input id="return-reason" placeholder="যেমন: কাস্টমার বদলে অন্য বই নিয়েছে">
          </div>
          <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px">
            <button class="btn btn-ghost" onclick="document.getElementById('return-modal').remove()">বাতিল</button>
            <button class="btn btn-primary" onclick="processReturn(${saleId})">রিটার্ন কনফার্ম করুন</button>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
  } catch(e) { toast('ডাটা লোড করা যায়নি', 'error'); }
}

async function processReturn(saleId) {
  const inputs = document.querySelectorAll('.return-qty');
  const items = [];
  inputs.forEach(input => {
    const qty = parseInt(input.value);
    if (qty > 0) {
      items.push({ book_id: input.dataset.id, quantity: qty });
    }
  });

  if (!items.length) { toast('অন্তত একটি বইয়ের পরিমাণ লিখুন', 'error'); return; }

  const reason = document.getElementById('return-reason').value;

  try {
    await api(`/sales/${saleId}/return_items/`, 'POST', { items, reason });
    toast('বই ফেরত নেওয়া হয়েছে এবং স্টক আপডেট হয়েছে ✓');
    document.getElementById('return-modal').remove();
    initInvoices();
  } catch(e) {
    toast(e.error || 'রিটার্ন প্রসেস করা যায়নি', 'error');
  }
}

document.addEventListener('DOMContentLoaded', initInvoices);
</script>
{% endblock %}
