{% extends 'base.html' %}
{% block page_title %}বিক্রয় (POS){% endblock %}

{% block extra_css %}
<style>
/* ─── POS SHELL ─── */
.pos-shell {
  display: grid;
  grid-template-columns: minmax(0,1fr) 400px;
  gap: 16px;
  height: calc(100vh - 100px);
  animation: fadeUp .3s ease both;
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(12px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ─── LEFT: Book picker ─── */
.books-panel {
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow: hidden;
}

/* search */
.pos-search {
  position: relative;
}

.pos-search input {
  width: 100%;
  height: 44px;
  padding: 0 18px 0 46px;
  border-radius: 12px;
  border: 2px solid var(--border);
  background: #fff;
  font-size: 16px;
  font-weight: 500;
  color: var(--text);
  box-shadow: 0 2px 12px rgba(13,51,38,.06);
  transition: border-color .15s, box-shadow .15s;
}

.pos-search input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(27,122,85,.1);
  outline: none;
}

.pos-search-icon {
  position: absolute;
  left: 17px; top: 50%;
  transform: translateY(-50%);
  font-size: 20px;
  color: var(--muted);
  pointer-events: none;
}

/* filter row */
.pos-filter-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  flex-shrink: 0;
}

.pos-filter-row select {
  width: auto;
  flex: 0 1 150px;
  min-height: 36px;
  height: 36px;
  padding: 0 10px;
  border-radius: 9px;
  border: 1.5px solid var(--border);
  background: #fff;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text2);
  font-family: 'Hind Siliguri', sans-serif;
  cursor: pointer;
}

.filter-check {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text2);
  cursor: pointer;
  flex-shrink: 0;
  white-space: nowrap;
}

.filter-check input {
  width: auto;
  min-height: auto;
  cursor: pointer;
}

/* stats bar */
.pos-stats-bar {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  flex-shrink: 0;
}

.psb-item {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 9px 12px;
  display: flex;
  align-items: center;
  gap: 9px;
}

.psb-item.clickable { cursor: pointer; transition: all .15s; }
.psb-item.clickable:hover { border-color: var(--accent); box-shadow: 0 4px 14px rgba(27,122,85,.12); }
.psb-item.active { border-color: var(--accent); background: var(--g100); }

.psb-icon {
  width: 30px; height: 30px;
  border-radius: 8px;
  background: var(--g100);
  color: var(--g700);
  display: grid; place-items: center;
  flex-shrink: 0;
}

.psb-info strong {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px; font-weight: 700;
  color: var(--g900);
  line-height: 1;
}

.psb-info span { font-size: 12.5px; color: var(--muted); font-weight: 700; }

/* book grid */
.books-scroll {
  flex: 1 1 0;
  min-height: 120px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

/* cart list — full width, below the book grid */
.cart-table-wrap {
  flex: 1 1 0;
  min-height: 120px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: #fff;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.cart-table { width: 100%; border-collapse: collapse; }

.cart-table thead th {
  position: sticky; top: 0; z-index: 1;
  background: var(--surface2);
  text-align: left;
  padding: 8px 12px;
  font-size: 10.5px;
  font-weight: 800;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .05em;
  border-bottom: 1px solid var(--border);
}

.cart-table td {
  padding: 8px 12px;
  border-bottom: 1px solid #f0f7f3;
  vertical-align: top;
}

.cart-table tbody tr:last-child td { border-bottom: none; }
.cart-table tbody tr:hover td { background: var(--surface2); }

.book-grid {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-right: 4px;
}

/* book row (list item) */
.book-row {
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 8px 10px;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 12px;
}

.book-row:hover {
  border-color: var(--accent);
  background: var(--g100);
}

.book-row:active { transform: scale(.99); }

.book-row:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

.book-row.out {
  opacity: .5;
  cursor: not-allowed;
  pointer-events: none;
}

.book-cover {
  width: 42px;
  height: 56px;
  object-fit: contain;
  border-radius: 6px;
  background: var(--g100);
  border: 1px solid var(--border);
  flex-shrink: 0;
}

.book-row-info {
  flex: 1;
  min-width: 0;
}

.book-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--g900);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.book-author {
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.book-price-block {
  display: flex;
  align-items: baseline;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: flex-end;
  flex-shrink: 0;
}

.book-price {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
}

.book-price-mrp {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  text-decoration: line-through;
}

.book-disc-badge {
  font-size: 11px;
  font-weight: 800;
  color: #fff;
  background: var(--danger);
  padding: 2px 7px;
  border-radius: 99px;
}

.book-stock-badge {
  font-size: 12px;
  font-weight: 800;
  background: var(--g100);
  color: var(--g700);
  padding: 3px 8px;
  border-radius: 99px;
  flex-shrink: 0;
  white-space: nowrap;
}

.book-stock-badge.zero { background: var(--danger-soft); color: var(--danger-dark); }

.book-external-badge {
  display: inline-block;
  background: var(--warning-soft);
  border: 1px solid var(--border);
  border-radius: 99px;
  font-size: 10px;
  font-weight: 800;
  padding: 1px 7px;
  color: var(--text2);
  margin-left: 6px;
  vertical-align: middle;
}

.book-row-add {
  width: 30px; height: 30px;
  border-radius: 8px;
  background: var(--g100);
  color: var(--accent);
  display: grid;
  place-items: center;
  font-size: 16px;
  flex-shrink: 0;
  transition: all .15s;
}

.book-row:hover .book-row-add {
  background: var(--accent);
  color: #fff;
}

/* ─── RIGHT: Receipt / cart panel ─── */
.receipt-panel {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 0;
  box-shadow: 0 4px 24px rgba(13,51,38,.08);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  height: 100%;
}

/* Receipt header */
.receipt-header {
  background: linear-gradient(135deg, var(--g800), var(--g900));
  padding: 18px 20px 16px;
  flex-shrink: 0;
}

.rh-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}

.rh-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 16px;
  font-weight: 800;
  color: #fff;
}

.rh-sub { font-size: 12.5px; color: rgba(255,255,255,.7); }

.clear-btn {
  background: rgba(229,62,62,.2);
  border: 1px solid rgba(229,62,62,.3);
  border-radius: 99px;
  color: #fca5a5;
  cursor: pointer;
  font-size: 13px;
  font-weight: 800;
  padding: 5px 12px;
  transition: background .15s;
}
.clear-btn:hover { background: rgba(229,62,62,.35); }

/* Cart items (rows inside .cart-table, see .cart-table-wrap above) */
.cart-empty {
  text-align: center;
  padding: 28px 10px;
  color: var(--muted);
  font-size: 14.5px;
  font-weight: 600;
}

.cart-empty-icon { font-size: 36px; margin-bottom: 8px; opacity: .5; }

.ci-name {
  min-width: 220px;
}

.ci-name strong {
  display: block;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--g900);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ci-name small { font-size: 12.5px; color: var(--muted); }
.ci-name .ci-breakdown { display: block; font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 2px; }
.ci-name .ci-breakdown b { color: var(--g700); font-weight: 700; }

.ci-qty {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}

.qb {
  width: 30px; height: 30px;
  border-radius: 8px;
  background: #fff;
  border: 1.5px solid var(--border);
  cursor: pointer;
  font-size: 14px;
  font-weight: 800;
  color: var(--text2);
  display: grid; place-items: center;
  transition: all .14s;
}
.qb:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.qb:disabled { opacity: .35; cursor: not-allowed; }
.qb:disabled:hover { background: #fff; color: var(--text2); border-color: var(--border); }
.qb:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.ci-count-input {
  width: 42px;
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 700;
  color: var(--g900);
  border: 1.5px solid var(--border);
  border-radius: 7px;
  padding: 4px 2px;
  background: #fff;
}
.ci-count-input:focus { border-color: var(--accent); outline: none; }

.ci-total {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14.5px;
  font-weight: 700;
  color: var(--accent);
  flex-shrink: 0;
  min-width: 54px;
  text-align: right;
}

.ci-remove {
  width: 28px; height: 28px;
  border-radius: 7px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 13px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  transition: all .14s;
}
.ci-remove:hover { background: rgba(229,62,62,.12); color: var(--danger); }

.ci-adjust {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 6px;
  align-items: center;
  margin-top: 5px;
}

.ci-adjust label {
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 800;
  margin: 0;
}

.ci-adjust input {
  min-height: 30px;
  padding: 4px 7px;
  border-radius: 7px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  text-align: right;
}

/* Billing form */
.billing-form {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.stat-mini-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}

.stat-mini {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.stat-mini span { font-size: 11px; font-weight: 700; color: var(--muted); }
.stat-mini strong { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 800; color: var(--g900); }

/* Step labels */
.step-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  font-weight: 800;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  margin: 14px 0 8px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

.step-label:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }

.step-num {
  width: 20px; height: 20px;
  background: var(--g100);
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 800;
  color: var(--g700);
  flex-shrink: 0;
}

/* form fields in billing */
.bf-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 8px;
}

.bf-row.single { grid-template-columns: 1fr; }

.bf-field { display: flex; flex-direction: column; gap: 4px; }

.bf-field label {
  font-size: 12.5px;
  font-weight: 800;
  color: var(--text2);
  letter-spacing: .02em;
}

.bf-field input,
.bf-field select {
  min-height: 40px;
  padding: 8px 12px;
  border-radius: 9px;
  border: 1.5px solid var(--border);
  background: var(--surface2);
  font-size: 14.5px;
  font-family: 'Hind Siliguri', sans-serif;
  color: var(--text);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
  width: 100%;
}

.bf-field input:focus,
.bf-field select:focus {
  border-color: var(--accent);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(27,122,85,.1);
}

.bf-hint {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.55;
  margin: -3px 0 10px;
}

.phone-check-indicator {
  display: block;
  min-height: 15px;
  font-size: 12.5px;
  font-weight: 800;
  color: var(--accent);
  margin-top: 2px;
}

/* charges box */
.charges-box {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 8px;
}

.charges-box .bf-row { margin-bottom: 0; gap: 8px; }

/* wholesale customer dropdown */
.ws-wrap { position: relative; margin-bottom: 8px; }

#wholesale-results {
  position: absolute;
  top: 100%; left: 0; right: 0;
  background: #fff;
  border: 1.5px solid var(--accent);
  border-top: none;
  border-radius: 0 0 10px 10px;
  max-height: 160px;
  overflow-y: auto;
  z-index: 200;
  box-shadow: 0 8px 24px rgba(13,51,38,.12);
  display: none;
}

.wsr-item {
  padding: 10px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background .12s;
}
.wsr-item:last-child { border-bottom: none; }
.wsr-item:hover { background: var(--g100); }
.wsr-item strong { display: block; font-size: 14.5px; color: var(--g900); }
.wsr-item small  { font-size: 12.5px; color: var(--muted); }

/* Summary totals */
.totals-box {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  margin: 10px 0;
}

.total-line {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  font-size: 14.5px;
  color: var(--text2);
  font-weight: 600;
  border-bottom: 1px solid #eef4f0;
}

.total-line:last-child { border-bottom: none; }

.total-line span:last-child {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
}

.total-line.big {
  font-size: 18px;
  font-weight: 800;
  color: var(--g900);
  padding: 8px 0;
  border-top: 2px solid var(--border);
  margin-top: 4px;
}

.total-line.due-line span:last-child { color: var(--danger); }

.total-line.change-line span:last-child { color: var(--accent-dark); }

.total-line.grand {
  font-size: 15px;
  font-weight: 800;
  color: var(--danger);
}

/* paid amount input — big & obvious */
.paid-wrap {
  background: #f0fbf4;
  border: 2px solid var(--g400);
  border-radius: 12px;
  padding: 12px 14px;
  margin: 8px 0;
}

.paid-wrap label {
  font-size: 13.5px;
  font-weight: 800;
  color: var(--g700);
  margin-bottom: 6px;
  display: block;
  letter-spacing: .04em;
}

.paid-wrap input {
  width: 100%;
  height: 48px;
  background: #fff !important;
  border: 2px solid var(--g300) !important;
  border-radius: 10px !important;
  font-family: 'JetBrains Mono', monospace !important;
  font-size: 22px !important;
  font-weight: 700 !important;
  color: var(--g800) !important;
  text-align: right;
  padding: 0 14px !important;
}

.paid-wrap input:focus {
  border-color: var(--accent) !important;
  box-shadow: 0 0 0 4px rgba(27,122,85,.12) !important;
  outline: none;
}

.paid-quick-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.paid-quick-btn {
  flex: 1;
  min-height: 34px;
  border-radius: 8px;
  border: 1.5px solid var(--g300);
  background: #fff;
  color: var(--g700);
  font-family: 'Hind Siliguri', sans-serif;
  font-size: 12.5px;
  font-weight: 800;
  cursor: pointer;
  transition: all .15s;
}

.paid-quick-btn:hover { background: var(--g100); border-color: var(--accent); }

.paid-quick-btn.full {
  flex: 1.4;
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.paid-quick-btn.full:hover { background: var(--accent-dark); }

.paid-warn {
  margin-top: 8px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--warning-dark);
  background: var(--warning-soft);
  border: 1px solid var(--warning-border);
  border-radius: 8px;
  padding: 8px 10px;
  line-height: 1.5;
}

/* CTA button */
.cta-btn {
  width: 100%;
  min-height: 52px;
  border-radius: 14px;
  background: var(--accent);
  color: #fff;
  border: none;
  cursor: pointer;
  font-family: 'Hind Siliguri', sans-serif;
  font-size: 17px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 4px;
  box-shadow: 0 8px 28px rgba(27,122,85,.3);
  transition: all .18s;
}

.cta-btn:hover {
  background: var(--accent-dark);
  box-shadow: 0 12px 36px rgba(27,122,85,.4);
  transform: translateY(-2px);
}

.cta-btn:active { transform: scale(.98); }

.cta-btn:disabled {
  background: var(--muted);
  box-shadow: none;
  cursor: not-allowed;
  transform: none;
}

/* ─── SUCCESS MODAL ─── */
.sale-modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(13,51,38,.55);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  animation: fadeIn .2s ease;
}

@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

.sale-modal {
  background: #fff;
  border-radius: 22px;
  padding: 36px 32px 28px;
  width: 380px;
  max-width: 90vw;
  text-align: center;
  box-shadow: 0 24px 64px rgba(13,51,38,.25);
  animation: popUp .25s cubic-bezier(.34,1.56,.64,1) both;
}

@keyframes popUp {
  from { transform: scale(.88) translateY(20px); opacity:0; }
  to   { transform: scale(1)   translateY(0);    opacity:1; }
}

.modal-check {
  width: 72px; height: 72px;
  background: var(--g100);
  color: var(--accent);
  border-radius: 50%;
  display: grid;
  place-items: center;
  margin: 0 auto 18px;
}

.modal-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--g900);
  margin-bottom: 8px;
}

.modal-sub {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 24px;
}

.modal-invoice {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
}

.modal-actions { display: flex; flex-direction: column; gap: 10px; }

/* ─── Mobile sticky cart bar ─── */
.mobile-sticky-bar {
  display: none;
  position: sticky;
  bottom: 0;
  z-index: 50;
  background: #fff;
  border-top: 1px solid var(--border);
  box-shadow: 0 -6px 20px rgba(13,51,38,.1);
  padding: 10px 16px;
  align-items: center;
  justify-content: space-between;
  border-radius: 14px 14px 0 0;
  margin-top: 10px;
}

.msb-info { display: flex; flex-direction: column; }
.msb-info strong { font-size: 13px; color: var(--g900); }
.msb-info span { font-family: 'JetBrains Mono', monospace; font-weight: 800; color: var(--accent); font-size: 16px; }

.msb-btn {
  background: var(--accent);
  color: #fff;
  border: none;

{% block extra_js %}
<script>
let allBooks             = [];
let allCustomers         = [];
let lastCustomerFetch    = 0;
let cart                 = [];
let currentCustomerDue   = 0;
let lowStockFilterActive = false;
let savedRetailCommission = 0;
let phoneCheckTimer      = null;

const CART_STORAGE_KEY = 'pos_cart_draft_v1';
const PLACEHOLDER_COVER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="158" height="130"><rect width="100%" height="100%" fill="#eafaf2"/><g transform="translate(79,65)" fill="none" stroke="#1a6347" stroke-width="3"><rect x="-26" y="-20" width="52" height="40" rx="3"/><line x1="0" y1="-20" x2="0" y2="20"/></g></svg>'
);

/* warn before an accidental refresh/close wipes an in-progress sale */
window.addEventListener('beforeunload', function (e) {
  if (cart.length) {
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ৳ amounts everywhere in POS: whole taka, Bengali numerals — matches rest of the app */
function money(v) {
  // অন্য সব পেজে ব্যবহৃত num()-এর সাথে মিলিয়ে রাখা হয়েছে, নাহলে একই বিক্রয়ের টাকার
  // অঙ্ক POS-এ এক রকম আর ইনভয়েস/ড্যাশবোর্ডে অন্য রকম (রাউন্ড করা) দেখাতো।
  return num(v);
}

function coverFallback(img) {
  img.onerror = null;
  img.src = PLACEHOLDER_COVER;
}

/* ══════════════════════════════════════
   CART DRAFT PERSISTENCE (survive refresh)
══════════════════════════════════════ */
function saveCartDraft() {
  try { localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart)); } catch (_) {}
}

function clearCartDraft() {
  try { localStorage.removeItem(CART_STORAGE_KEY); } catch (_) {}
}

function loadCartDraft() {
  try {
    const raw = localStorage.getItem(CART_STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (!Array.isArray(saved) || !saved.length) return;
    cart = saved.filter(item => {
      const book = allBooks.find(b => b.id === item.bid);
      if (!book || !book.is_active) return false;
      item.max = book.shop_quantity;
      item.qty = Math.max(0, Math.min(item.max, Math.floor(item.qty || 0)));
      return item.qty > 0;
    });
    if (cart.length) toast(`আগের অসম্পূর্ণ বিক্রয় ফিরিয়ে আনা হয়েছে (${cart.length}টি বই)`, 'success');
  } catch (_) {}
}

/* ══════════════════════════════════════
   ERROR FORMATTING
══════════════════════════════════════ */
function formatApiError(e) {
  if (!e || typeof e !== 'object') return 'একটি ত্রুটি হয়েছে। আবার চেষ্টা করুন।';
  if (e.detail) return String(e.detail);
  const parts = [];
  for (const key in e) {
    const val = e[key];
    parts.push(Array.isArray(val) ? val.join(' ') : String(val));
  }
  return parts.length ? parts.join(' | ') : 'একটি ত্রুটি হয়েছে। আবার চেষ্টা করুন।';
}

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
async function loadAllBooks() {
  let page = 1;
  let books = [];
  while (true) {
    const r = await api(`/books/?page=${page}&page_size=100`);
    books = books.concat(r.results);
    if (!r.next) break;
    page++;
  }
  return books;
}

async function initPOS() {
  const root = document.getElementById('pos-root');
  try {
    /* paint the grid as soon as the first page is in, instead of blocking on the whole catalog */
    const first = await api('/books/?page=1&page_size=100');
    allBooks = first.results;
    renderPOS(root);

    let next = first.next;
    let page = 2;
    while (next) {
      const r = await api(`/books/?page=${page}&page_size=100`);
      allBooks = allBooks.concat(r.results);
      updateGroupOptions();
      filterBooks();
      next = r.next;
      page++;
    }

    const cRes = await api('/sales/customers/?page_size=1000');
    allCustomers = cRes.results;
    lastCustomerFetch = Date.now();

    loadCartDraft();
    renderCart();
    calcTotals();
  } catch (e) {
    root.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${icon('alert-triangle', 44)}</div>
        <h3>বই লোড হয়নি</h3>
        <p>সার্ভার চালু আছে কিনা দেখুন।</p>
      </div>`;
  }
}

/* ══════════════════════════════════════
   FILTERS
══════════════════════════════════════ */
function updateGroupOptions() {
  const sel = document.getElementById('filter-group');
  if (!sel) return;
  const current = sel.value;
  const groups = Array.from(new Set(allBooks.map(b => b.group_name).filter(Boolean))).sort((a,b) => a.localeCompare(b, 'bn'));
  sel.innerHTML = `<option value="">সব বিভাগ</option>` + groups.map(g => `<option value="${g}">${g}</option>`).join('');
  if (groups.includes(current)) sel.value = current;
}

function toggleLowStockFilter() {
  lowStockFilterActive = !lowStockFilterActive;
  document.getElementById('psb-lowstock')?.classList.toggle('active', lowStockFilterActive);
  filterBooks();
}

function resetFilters() {
  lowStockFilterActive = false;
  document.getElementById('psb-lowstock')?.classList.remove('active');
  const s   = document.getElementById('book-search');    if (s)   s.value = '';
  const g   = document.getElementById('filter-group');   if (g)   g.value = '';
  const so  = document.getElementById('filter-sort');    if (so)  so.value = 'name';
  const ins = document.getElementById('filter-instock'); if (ins) ins.checked = false;
  filterBooks();
}

/* ══════════════════════════════════════
   BOOK GRID
══════════════════════════════════════ */
function getFilteredBooks() {
  const q       = (document.getElementById('book-search')?.value || '').toLowerCase().trim();
  const group   = document.getElementById('filter-group')?.value || '';
  const sort    = document.getElementById('filter-sort')?.value || 'name';
  const inStock = document.getElementById('filter-instock')?.checked || false;

  let list = allBooks.filter(b =>
    b.is_active &&
    (!q ||
      b.title.toLowerCase().includes(q) ||
      (b.author||'').toLowerCase().includes(q) ||
      (b.product_code||'').toLowerCase().includes(q)
    ) &&
    (!group || b.group_name === group) &&
    (!inStock || Number(b.shop_quantity||0) > 0) &&
    (!lowStockFilterActive || Number(b.shop_quantity||0) <= 5)
  );

  switch (sort) {
    case 'stock-asc':  list = list.sort((a,b) => Number(a.shop_quantity||0) - Number(b.shop_quantity||0)); break;
    case 'price-desc': list = list.sort((a,b) => (parseFloat(b.mrp)||parseFloat(b.selling_price)||0) - (parseFloat(a.mrp)||parseFloat(a.selling_price)||0)); break;
    case 'price-asc':  list = list.sort((a,b) => (parseFloat(a.mrp)||parseFloat(a.selling_price)||0) - (parseFloat(b.mrp)||parseFloat(b.selling_price)||0)); break;
    default:            list = list.sort((a,b) => a.title.localeCompare(b.title, 'bn')); break;
  }
  return list;
}

function handleSearchKey(e) {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    document.querySelector('#book-grid .book-row')?.focus();
    return;
  }
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const matches = getFilteredBooks();
  if (matches.length === 1) {
    addToCart(matches[0].id);
    const s = document.getElementById('book-search');
    if (s) { s.value = ''; filterBooks(); s.focus(); }
  } else if (matches.length > 1) {
    // একাধিক বই মিললে তীর-চিহ্ন (↓) দিয়ে লিস্ট থেকে বেছে নেওয়া যাবে, মাউস ছাড়াই
    document.querySelector('#book-grid .book-row')?.focus();
  } else {
    toast('কোনো বই পাওয়া যায়নি', 'error');
  }
}

function handleGridKey(e) {
  const row = e.target.closest('.book-row');
  if (!row) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const rows = Array.from(document.querySelectorAll('#book-grid .book-row'));
    const idx = rows.indexOf(row);
    const next = e.key === 'ArrowDown' ? rows[idx + 1] : rows[idx - 1];
    if (next) next.focus();
    else if (e.key === 'ArrowUp') document.getElementById('book-search')?.focus();
  } else if (e.key === 'Escape') {
    document.getElementById('book-search')?.focus();
  }
}

function filterBooks() {
  const list = getFilteredBooks();
  const grid = document.getElementById('book-grid');
  if (!grid) return;

  if (!list.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${icon('search', 44)}</div>
        <h3>কোনো বই পাওয়া যায়নি</h3>
        <p>অন্য কিছু লিখে চেষ্টা করুন বা ফিল্টার পরিবর্তন করুন</p>
      </div>`;
    return;
  }

  grid.innerHTML = list.map(b => {
    const mrp            = parseFloat(b.mrp) || 0;
    const commissionPct  = Math.min(100, Math.max(0, parseFloat(b.commission || 0)));
    const net             = mrp > 0 ? mrp * (1 - commissionPct/100) : (parseFloat(b.selling_price) || 0);
    const showDiscount    = mrp > 0 && commissionPct > 0;
    const outOfStock      = b.shop_quantity <= 0;
    return `
    <div class="book-row ${outOfStock ? 'out' : ''}"
         onclick="addToCart(${b.id})"
         tabindex="0" role="button"
         aria-label="${b.title} যোগ করুন"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();addToCart(${b.id})}">
      <img class="book-cover"
           src="${b.image || ''}"
           onerror="coverFallback(this)"
           alt="${b.title}">
      <div class="book-row-info">
        <div class="book-title" title="${b.title}">${b.title}${b.source === 'external' ? `<span class="book-external-badge">${icon('briefcase', 10)} বাইরের</span>` : ''}</div>
        <div class="book-author">${b.author || '—'}</div>
      </div>
      <div class="book-price-block">
        ${showDiscount ? `<span class="book-price-mrp">৳${money(mrp)}</span>` : ''}
        <span class="book-price">৳${money(net)}</span>
        ${showDiscount ? `<span class="book-disc-badge">-${commissionPct.toFixed(0)}%</span>` : ''}
      </div>
      <span class="book-stock-badge ${outOfStock ? 'zero' : ''}">${b.shop_quantity} কপি</span>
      <div class="book-row-add">${icon('plus', 15)}</div>
    </div>`;
  }).join('');
}

/* ══════════════════════════════════════
   CART
══════════════════════════════════════ */
function addToCart(id) {
  const book = allBooks.find(b => b.id === id);
  if (!book || book.shop_quantity <= 0) return;

  const ex = cart.find(i => i.bid === id);
  if (ex) {
    if (ex.qty >= book.shop_quantity) { toast(`দোকানে মাত্র ${book.shop_quantity}টি আছে`, 'error'); return; }
    ex.qty++;
  } else {
    cart.push({
      bid: id,
      title: book.title,
      price: parseFloat(book.mrp) || parseFloat(book.selling_price) || 0,
      qty: 1,
      max: book.shop_quantity,
      defaultCommission: parseFloat(book.commission || 0),
      extraCommission: 0
    });
  }
  renderCart();
  calcTotals();
}

function changeQty(id, d) {
  const item = cart.find(i => i.bid === id);
  if (!item) return;
  if (d > 0 && item.qty >= item.max) { toast(`দোকানে মাত্র ${item.max}টি আছে`, 'error'); return; }
  item.qty = Math.max(0, Math.min(item.max, item.qty + d));
  if (item.qty === 0) cart = cart.filter(i => i.bid !== id);
  renderCart();
  calcTotals();
}

function setQty(id, value) {
  const item = cart.find(i => i.bid === id);
  if (!item) return;
  let v = Math.floor(parseFloat(value) || 0);
  v = Math.max(0, Math.min(item.max, v));
  if (v === 0) cart = cart.filter(i => i.bid !== id);
  else item.qty = v;
  renderCart();
  calcTotals();
}

function removeItem(id) {
  cart = cart.filter(i => i.bid !== id);
  if (!cart.length) resetGlobalDiscount();
  renderCart();
  calcTotals();
}

function resetGlobalDiscount() {
  // কার্ট খালি হয়ে গেলে আগের বিক্রয়ের ম্যানুয়াল ছাড়/কমিশন% যেন পরের নতুন
  // বিক্রয়ে না লেগে যায় — নাহলে আগের বইয়ে দেওয়া বাড়তি ছাড় পরের অন্য বইয়ের
  // দামেও নীরবে যোগ হয়ে যেত।
  if (document.getElementById('commission')) document.getElementById('commission').value = 0;
  if (document.getElementById('discount'))    document.getElementById('discount').value = 0;
}

function setExtraCommission(id, value) {
  const item = cart.find(i => i.bid === id);
  if (!item) return;
  item.extraCommission = Math.min(100, Math.max(0, parseFloat(value || 0)));
  calcTotals();
}

async function clearCart() {
  if (!cart.length) return;
  const ok = await confirmModal('কার্টের সব বই মুছে ফেলতে চান? এই কাজটি বাতিল করা যাবে না।', { danger: true });
  if (!ok) return;
  cart = [];
  clearCartDraft();
  resetGlobalDiscount();
  renderCart();
  calcTotals();
}

function renderCart() {
  const el  = document.getElementById('cart-scroll');
  const lbl = document.getElementById('cart-count-lbl');
  if (!el) return;

  const total = cart.reduce((s,i) => s + itemNet(i), 0);
  if (lbl) lbl.textContent = cart.length
    ? `${cart.length}টি বই • মোট ৳${money(total)}`
    : 'কোনো বই নেই — বাম থেকে বই যোগ করুন';

  const msbCount = document.getElementById('msb-count');
  const msbTotal = document.getElementById('msb-total');
  if (msbCount) msbCount.textContent = cart.length ? `${cart.length}টি বই` : 'কার্ট খালি';
  if (msbTotal) msbTotal.textContent = `৳${money(total)}`;

  if (!cart.length) {
    el.innerHTML = `
      <tr><td colspan="4" class="cart-empty">
        <div class="cart-empty-icon">${icon('clipboard', 34)}</div>
        বাম পাশ থেকে বই ক্লিক করুন
      </td></tr>`;
    saveCartDraft();
    return;
  }

  const saleType    = document.getElementById('sale-type')?.value || 'retail';
  const globalActive = defaultCommissionPct() > 0;
  const baseLabel = saleType === 'wholesale'
    ? (globalActive ? 'গ্লোবাল' : 'বইয়ের ডিফল্ট')
    : (globalActive ? 'বইয়ের ডিফল্ট + গ্লোবাল' : 'বইয়ের ডিফল্ট');

  el.innerHTML = cart.map(i => `
    <tr>
      <td>
        <div class="ci-name">
          <strong title="${i.title}">${i.title}</strong>
          <small>৳${money(i.price)} × ${i.qty}</small>
          <small class="ci-breakdown">
            ছাড় <b>${itemCommissionPct(i).toFixed(1)}%</b>
            (${baseLabel}${i.extraCommission > 0 ? ' + অতিরিক্ত' : ''})
            — ৳${money(itemDiscount(i))} বাদ
          </small>
          <div class="ci-adjust">
            <label>Extra %</label>
            <input type="number" min="0" max="100" step="0.1" value="${i.extraCommission || 0}" onclick="event.stopPropagation()" oninput="setExtraCommission(${i.bid}, this.value)" onchange="renderCart()">
          </div>
        </div>
      </td>
      <td>
        <div class="ci-qty">
          <button class="qb" aria-label="কমান" onclick="changeQty(${i.bid},-1)">−</button>
          <input class="ci-count-input" type="number" min="1" max="${i.max}" value="${i.qty}" onclick="event.stopPropagation()" onchange="setQty(${i.bid}, this.value)">
          <button class="qb" aria-label="বাড়ান" ${i.qty >= i.max ? 'disabled' : ''} onclick="changeQty(${i.bid},+1)">+</button>
        </div>
      </td>
      <td><div class="ci-total">৳${money(itemNet(i))}</div></td>
      <td><button class="ci-remove" aria-label="মুছে ফেলুন" onclick="removeItem(${i.bid})">${icon('close', 13)}</button></td>
    </tr>`).join('');

  saveCartDraft();
}

function toggleSaleType() {
  const type = document.getElementById('sale-type').value;
  const ws   = document.getElementById('ws-section');
  const n    = document.getElementById('cus-name');
  const p    = document.getElementById('cus-phone');

  if (type === 'wholesale') {
    savedRetailCommission = parseFloat(document.getElementById('commission')?.value || 0);
    ws.style.display = 'block';
    n.value = ''; p.value = '';
    document.getElementById('wholesale-search').focus();
  } else {
    ws.style.display = 'none';
    n.value = ''; p.value = '';
    document.getElementById('commission').value = savedRetailCommission || 0;
    document.getElementById('wholesale-search').value = '';
    fromCommission();
  }
}

function searchWS() {
  const q   = document.getElementById('wholesale-search').value.toLowerCase();
  const box = document.getElementById('wholesale-results');
  if (!q) { box.style.display = 'none'; return; }

  const m = allCustomers.filter(c =>
    c.customer_type === 'wholesale' &&
    (c.name.toLowerCase().includes(q) || (c.phone||'').includes(q) || (c.customer_code||'').toLowerCase().includes(q))
  );

  box.innerHTML = m.length
    ? m.map(c => `
        <div class="wsr-item" onclick="selectWS(${c.id})">
          <strong>${c.name}</strong>
          <small>কোড: ${c.customer_code||'N/A'} | ফোন: ${c.phone}</small>
        </div>`).join('')
    : `<div class="wsr-item"><small>কোনো গ্রাহক পাওয়া যায়নি</small></div>`;

  box.style.display = 'block';
}

function selectWS(id) {
  const c = allCustomers.find(x => x.id === id);
  if (!c) return;
  document.getElementById('selected-ws-id').value   = c.id;
  document.getElementById('wholesale-search').value = `${c.name} (${c.customer_code})`;
  document.getElementById('wholesale-results').style.display = 'none';
  document.getElementById('cus-name').value  = c.name;
  document.getElementById('cus-phone').value = c.phone;
  document.getElementById('commission').value = c.default_commission;
  fetchDue(); fromCommission();
}

  const indicator = document.getElementById('phone-check-indicator');

async function refreshCustomersIfStale() {
  // অন্য কোনো স্টাফ শিফট চলাকালীন নতুন গ্রাহক যোগ করলে যেন সেটা মিস না হয়,
  // তাই ফোকাসে গেলে (কিন্তু বারবার না) ব্যাকগ্রাউন্ডে তালিকা রিফ্রেশ করা হচ্ছে।

async function fetchDue() {
  const phone      = document.getElementById('cus-phone')?.value || '';
  const row        = document.getElementById('prev-due-row');
  const val        = document.getElementById('t-prev-due');
  const indicator  = document.getElementById('phone-check-indicator');
  currentCustomerDue = 0;
  if (indicator) indicator.innerHTML = '';

  if (phone && phone.length >= 11) {
    try {
      const res = await api(`/sales/customers/find_by_phone/?phone=${phone}`);
      if (res && res.id) {
        document.getElementById('cus-name').value = res.name;
        currentCustomerDue = parseFloat(res.total_due || 0);
        if (indicator) indicator.innerHTML = `${icon('check', 12)} পরিচিত গ্রাহক`;
      }
    } catch (_) {}
  }

  if (currentCustomerDue > 0) {
    row.style.display = 'flex';
    val.textContent   = `৳${money(currentCustomerDue)}`;
  } else {
    row.style.display = 'none';
  }
  calcTotals();
}

/* ══════════════════════════════════════
   TOTALS
══════════════════════════════════════ */
function defaultCommissionPct() {
  return Math.min(100, Math.max(0, parseFloat(document.getElementById('commission')?.value || 0)));
}

function itemGross(item) {
  return item.price * item.qty;
}

function itemBaseCommission(item) {
  const globalPct = defaultCommissionPct();
  const ownPct    = Math.min(100, Math.max(0, parseFloat(item.defaultCommission || 0)));
  const saleType  = document.getElementById('sale-type')?.value || 'retail';

  if (saleType === 'wholesale') {
    // পাইকারি গ্রাহকের জন্য কমিশন% একটা নির্দিষ্ট চুক্তির হার — বইয়ের নিজস্ব
    // ডিফল্ট কমিশন উপেক্ষা করে পুরোপুরি রিপ্লেস হয়।
    return globalPct > 0 ? globalPct : ownPct;
  }

  // খুচরা বিক্রয়ে বইয়ের নিজস্ব ডিফল্ট কমিশন (MRP থেকে দোকানের স্বাভাবিক ছাড়) সবসময় বহাল থাকে;
  // "ডিসকাউন্ট ৳ / কমিশন %" বক্সে কিছু লিখলে সেটা তার উপর বাড়তি ছাড় হিসেবে যোগ হয়,
  // প্রতিস্থাপন করে না — নাহলে ছোট একটা বাড়তি ছাড় দিতে গিয়ে দাম উল্টো বেড়ে যেত।
  return Math.min(100, ownPct + globalPct);
}

function itemCommissionPct(item) {
  return Math.min(100, itemBaseCommission(item) + Math.max(0, parseFloat(item.extraCommission || 0)));
}

function itemDiscount(item) {
  const gross = itemGross(item);
  return Math.min(gross, gross * itemCommissionPct(item) / 100);
}

function itemNet(item) {
  return Math.max(0, itemGross(item) - itemDiscount(item));
}

function fromCommission() {
  const sub  = cart.reduce((s,i) => s + itemGross(i), 0);
  const comm = defaultCommissionPct();
  if (document.getElementById('discount'))
    document.getElementById('discount').value = Math.round(sub * comm / 100);
  renderCart();
  calcTotals();
}

function calcTotals(manualDisc = false) {
  const sub  = cart.reduce((s,i) => s + itemGross(i), 0);
  const manualDiscount = parseFloat(document.getElementById('discount')?.value || 0);

  if (manualDisc && sub > 0) {
    document.getElementById('commission').value = Math.min(100, (manualDiscount/sub)*100).toFixed(6);
    renderCart();
  }

  const disc = cart.reduce((s,i) => s + itemDiscount(i), 0);

  const extra = (parseFloat(document.getElementById('pack')?.value||0))
              + (parseFloat(document.getElementById('courier')?.value||0))
              + (parseFloat(document.getElementById('txfee')?.value||0));

  const total  = Math.max(0, sub - disc + extra);
  const paid   = parseFloat(document.getElementById('paid')?.value || 0);
  const due    = Math.max(0, total - paid);
  const change = Math.max(0, paid - total);
  const grand  = currentCustomerDue + due;
  const totalQty = cart.reduce((s,i) => s + i.qty, 0);

  setText('t-items',    `${cart.length}`);
  setText('t-qty',      `${totalQty}`);
  setText('t-sub',      `৳${money(sub)}`);
  setText('t-disc',     `−৳${money(disc)}`);
  setText('t-extra',    `+৳${money(extra)}`);
  setText('t-total',    `৳${money(total)}`);
  setText('t-due',      `৳${money(due)}`);
  setText('t-change',   `৳${money(change)}`);
  setText('t-grand-due',`৳${money(grand)}`);

  const changeRow = document.getElementById('change-row');
  if (changeRow) changeRow.style.display = change > 0 ? 'flex' : 'none';

  const payMethod = document.getElementById('pay-method')?.value;
  const zeroWarn = document.getElementById('paid-zero-warn');
  if (zeroWarn) zeroWarn.style.display = (cart.length > 0 && total > 0 && paid === 0 && payMethod !== 'credit') ? 'block' : 'none';

  const overpayWarn = document.getElementById('paid-overpay-warn');
  const looksLikeTypo = total > 0 && paid > total * 20 && (paid - total) > 500;
  if (overpayWarn) overpayWarn.style.display = looksLikeTypo ? 'block' : 'none';

  const btn = document.getElementById('complete-btn');
  if (btn) btn.disabled = cart.length === 0;
}

function setText(id, v) {
  const el = document.getElementById(id);
  if (el) el.textContent = v;
}

/* ══════════════════════════════════════
   PAID AMOUNT HELPERS
══════════════════════════════════════ */
function onPaidInput() {
  const paidInput = document.getElementById('paid');
  if (paidInput && parseFloat(paidInput.value) < 0) paidInput.value = 0;
  calcTotals();
}

function currentBillTotal() {
  const sub  = cart.reduce((s,i) => s + itemGross(i), 0);
  const disc = cart.reduce((s,i) => s + itemDiscount(i), 0);
  const extra = (parseFloat(document.getElementById('pack')?.value||0))
              + (parseFloat(document.getElementById('courier')?.value||0))
              + (parseFloat(document.getElementById('txfee')?.value||0));
  return Math.round(Math.max(0, sub - disc + extra) * 100) / 100;
}

function setPaidFull() {
  document.getElementById('paid').value = currentBillTotal();
  calcTotals();
}

function setPaidAmount(v) {
  document.getElementById('paid').value = v;
  calcTotals();
}

function onPayMethodChange() {
  const method = document.getElementById('pay-method')?.value;
  const row = document.getElementById('paid-quick-row');
  if (method === 'credit') {
    document.getElementById('paid').value = 0;
    if (row) row.style.display = 'none';
  } else if (row) {
    row.style.display = 'flex';
  }
  calcTotals();
}

/* ══════════════════════════════════════
   COMPLETE SALE
══════════════════════════════════════ */
async function completeSale() {
  if (!cart.length) { toast('বই যোগ করুন আগে!', 'error'); return; }

  const btn = document.getElementById('complete-btn');
  btn.disabled = true;
  btn.textContent = 'প্রসেস হচ্ছে...';

  const payload = {
    customer_name:     document.getElementById('cus-name')?.value || 'Walk-in Customer',
    customer_phone:    document.getElementById('cus-phone')?.value || '',
    // "ডিসকাউন্ট ৳" ফিল্ডটা এখানে সরাসরি পাঠানো হয় না — সেটা ইতিমধ্যে প্রতিটা বইয়ের
    // commission%-এ রূপান্তরিত হয়ে items[].discount-এ চলে গেছে (দেখুন itemDiscount())।
    // এখানে সেই একই ছাড় আবার পাঠালে total-এ দ্বিগুণ বিয়োগ হয়ে যাবে (Sale.subtotal ইতিমধ্যে
    // item-discount নেট করে ফেলে, তারপর Sale.discount আবার বিয়োগ হয়)।
    discount:          0,
    packaging_charge:  parseFloat(document.getElementById('pack')?.value||0),
    courier_charge:    parseFloat(document.getElementById('courier')?.value||0),
    transaction_fee:   parseFloat(document.getElementById('txfee')?.value||0),
    paid_amount:       parseFloat(document.getElementById('paid')?.value||0),
    payment_method:    document.getElementById('pay-method')?.value,
    sale_type:         document.getElementById('sale-type')?.value || 'retail',
    items: cart.map(i => ({ book: i.bid, quantity: i.qty, unit_price: i.price, discount: itemDiscount(i) }))
  };

  try {
    const sale = await api('/sales/', 'POST', payload);
    showSuccessModal(sale);
    cart = [];
    clearCartDraft();

    // reload books for fresh stock count, keeping whatever the cashier was searching/filtering by
    const savedSearch  = document.getElementById('book-search')?.value || '';
    const savedGroup   = document.getElementById('filter-group')?.value || '';
    const savedSort    = document.getElementById('filter-sort')?.value || 'name';
    const savedInstock = document.getElementById('filter-instock')?.checked || false;

    allBooks = await loadAllBooks();
    renderPOS(document.getElementById('pos-root'));

    const searchEl  = document.getElementById('book-search');    if (searchEl)  searchEl.value = savedSearch;
    const groupEl   = document.getElementById('filter-group');   if (groupEl)   groupEl.value = savedGroup;
    const sortEl    = document.getElementById('filter-sort');    if (sortEl)    sortEl.value = savedSort;
    const instockEl = document.getElementById('filter-instock'); if (instockEl) instockEl.checked = savedInstock;
    filterBooks();
  } catch (e) {
    toast(formatApiError(e), 'error');
    btn.disabled = false;
    btn.innerHTML = `${icon('check', 18)} বিক্রয় সম্পন্ন করুন`;
  }
}

/* ══════════════════════════════════════
   SUCCESS MODAL
══════════════════════════════════════ */
function showSuccessModal(sale) {
  const html = `
    <div class="sale-modal-bg" id="sale-modal">
      <div class="sale-modal">
        <div class="modal-check">${icon('check', 34)}</div>
        <div class="modal-title">বিক্রয় হয়েছে!</div>
        <div class="modal-sub">
          ইনভয়েস নম্বর:
          <div class="modal-invoice">#${sale.invoice_number}</div>
          মোট বিল: ৳${money(sale.total)}
        </div>
        <div class="modal-actions">
          <a href="/api/sales/${sale.id}/print_invoice/"
             class="btn btn-primary"
             target="_blank"
             onclick="closeModal()"
             style="text-decoration:none; border-radius:12px; min-height:48px; font-size:15px;">
            ${icon('printer', 16)} ইনভয়েস প্রিন্ট করুন
          </a>
          <button class="btn btn-ghost" onclick="closeModal()" style="border-radius:12px; min-height:44px;">
            নতুন বিক্রয় শুরু করুন →
          </button>
          <button class="btn btn-ghost" onclick="undoLastSale(${sale.id})" style="border-radius:12px; min-height:40px; color:var(--danger); font-size:13px;">
            ${icon('x-circle', 14)} ভুল হয়েছে? এই বিক্রয় বাতিল করুন
          </button>
        </div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}

function closeModal() {
  document.getElementById('sale-modal')?.remove();
}

async function undoLastSale(saleId) {
  // বিক্রয় রেকর্ড সরাসরি ডিলিট করা হয় না (হিসাব/অডিট ট্রেইল ঠিক রাখতে) — বরং সব বই
  // return_items দিয়ে ফেরত নেওয়া হয়, যা স্টক ও বাকির হিসাব ঠিকভাবে রিভার্স করে এবং
  // ইনভয়েসে একটা রিটার্ন রেকর্ড হিসেবে থেকে যায় (invoices.html-এর মতোই)।
  const ok = await confirmModal('এই পুরো বিক্রয়টা বাতিল করতে চান? সব বই স্টকে ফিরে যাবে এবং বাকির হিসাব সমন্বয় হবে।', { danger: true });
  if (!ok) return;
  try {
    const sale = await api(`/sales/${saleId}/`);
    const items = (sale.items || []).map(i => ({ book_id: i.book, quantity: i.quantity }));
    if (!items.length) { toast('ফেরত দেওয়ার মতো কোনো বই পাওয়া যায়নি।', 'error'); return; }
    await api(`/sales/${saleId}/return_items/`, 'POST', { items, reason: 'POS-এ তাৎক্ষণিক ভুল সংশোধন' });
    toast('বিক্রয়টি বাতিল করা হয়েছে, বই স্টকে ফিরে গেছে।');
    closeModal();
  } catch (e) {
    const msg = e && typeof e === 'object' ? (e.error || e.detail || JSON.stringify(e)) : String(e);
    toast('বাতিল করা যায়নি: ' + msg, 'error');
  }
}

document.addEventListener('DOMContentLoaded', initPOS);
</script>
{% endblock %}
