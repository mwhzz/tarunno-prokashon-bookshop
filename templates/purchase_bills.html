{% extends "base.html" %}
{% block page_title %}ক্রয় রেকর্ড{% endblock %}

{% block extra_css %}
<style>
.pb-page { animation: fadeUp .3s ease both; }
@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

.pb-summary {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}
.pb-card {
  background: #fff; border: 1px solid var(--border);
  border-radius: 14px; padding: 12px 14px;
  box-shadow: 0 2px 12px rgba(13,51,38,.05);
}
.pb-label { font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
.pb-val { font-family:'JetBrains Mono', monospace; font-size:20px; font-weight:700; color:var(--g900); margin-top:2px; }
.pb-val.due { color: var(--danger); }
.pb-val.paid { color: var(--accent); }

.pb-filters {
  display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap;
  padding: 14px 20px; border-bottom: 1px solid var(--border);
}
.pb-filters .ff { display:flex; flex-direction:column; gap:4px; }
.pb-filters label { font-size:11px; font-weight:800; color:var(--text2); }
.pb-filters input {
  height:36px; padding:0 10px; border:1.5px solid var(--border); border-radius:8px;
  font-family:'Hind Siliguri',sans-serif; font-size:13px; outline:none;
}
.pb-filters input:focus { border-color:var(--accent); }
.pb-find-btn {
  height:36px; padding:0 18px; border-radius:8px; border:none;
  background:var(--accent); color:#fff; font-weight:800; font-size:13px; cursor:pointer;
}
.pb-find-btn:hover { background:var(--accent-dark); }
.pb-search-box { flex:1; min-width:200px; }

@media (max-width:900px) { .pb-summary { grid-template-columns: 1fr 1fr; } }
@media (max-width:520px) { .pb-summary { grid-template-columns: 1fr; } }
</style>
{% endblock %}

{% block content %}
<div class="pb-page">

  <div class="pb-summary" id="pb-summary">
    <div class="pb-card"><div class="pb-label">মোট মূল্য</div><div class="pb-val" id="sum-total">৳০</div></div>
    <div class="pb-card"><div class="pb-label">ডিসকাউন্ট</div><div class="pb-val" id="sum-discount">৳০</div></div>
    <div class="pb-card"><div class="pb-label">পরিশোধিত</div><div class="pb-val paid" id="sum-paid">৳০</div></div>
    <div class="pb-card"><div class="pb-label">বাকি</div><div class="pb-val due" id="sum-due">৳০</div></div>
  </div>

  <div class="table-wrap">
    <div class="pb-filters">
      <div class="ff">
        <label>শুরুর তারিখ</label>
        <input type="date" id="f-from">
      </div>
      <div class="ff">
        <label>শেষ তারিখ</label>
        <input type="date" id="f-to">
      </div>
      <button class="pb-find-btn" onclick="loadBills()">খুঁজুন</button>
      <div class="ff pb-search-box">
        <label>সার্চ (ভেন্ডর/মেমো)</label>
        <input type="text" id="f-search" placeholder="ভেন্ডরের নাম বা মেমো নম্বর" oninput="debouncedLoad()">
      </div>
    </div>

    <div class="table-header">
      <span class="table-title">📜 ক্রয় বিলের তালিকা</span>
    </div>

    <div id="bills-wrapper">
      <div class="loading" style="padding:40px"><div class="spinner"></div>&nbsp;লোড হচ্ছে...</div>
    </div>
  </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
let searchTimer = null;
let billsCache = [];

function debouncedLoad() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadBills, 350);
}

function buildParams() {
  const params = new URLSearchParams();
  const from = document.getElementById('f-from').value;
  const to = document.getElementById('f-to').value;
  const search = document.getElementById('f-search').value.trim();
  if (from) params.set('date_from', from);
  if (to) params.set('date_to', to);
  if (search) params.set('search', search);
  return params;
}

async function loadSummary() {
  try {
    const s = await api(`/purchase/bills/summary/?${buildParams().toString()}`);
    setText('sum-total', `৳${num(s.total_price)}`);
    setText('sum-discount', `৳${num(s.discount)}`);
    setText('sum-paid', `৳${num(s.paid)}`);
    setText('sum-due', `৳${num(s.due)}`);
  } catch (e) { /* summary is a nice-to-have, table load reports real errors */ }
}

async function loadBills() {
  const w = document.getElementById('bills-wrapper');
  w.innerHTML = `<div class="loading" style="padding:40px"><div class="spinner"></div>&nbsp;লোড হচ্ছে...</div>`;
  try {
    const params = buildParams();
    params.set('page_size', 200);
    const r = await api(`/purchase/bills/?${params.toString()}`);
    const bills = r.results || [];
    billsCache = bills;

    if (!bills.length) {
      w.innerHTML = `<div class="empty-state" style="padding:50px 20px;"><div class="empty-icon">📜</div><h3>কোনো বিল নেই</h3></div>`;
      loadSummary();
      return;
    }

    const truncatedNote = r.count > bills.length
      ? `<p style="font-size:12px; color:var(--muted); padding:8px 20px 0;">মোট ${num(r.count)}টির মধ্যে সাম্প্রতিক ${bills.length}টি দেখানো হচ্ছে — নির্দিষ্ট করে খুঁজতে উপরের তারিখ/সার্চ ব্যবহার করুন।</p>`
      : '';

    w.innerHTML = `
      ${truncatedNote}
      <table>
        <thead>
          <tr>
            <th style="padding:10px 20px">বিল</th>
            <th>ভেন্ডর</th>
            <th>মেমো</th>
            <th>মোট</th>
            <th>ডিসকাউন্ট</th>
            <th>পেইড</th>
            <th>বাকি</th>
            <th>তারিখ</th>
            <th>স্ট্যাটাস</th>
            <th>অ্যাকশন</th>
          </tr>
        </thead>
        <tbody>
          ${bills.map(b => `
            <tr style="cursor:pointer" onclick="location.href='/purchase/bills/${b.id}/'" title="বিস্তারিত দেখতে ক্লিক করুন">
              <td style="padding:10px 20px; font-family:monospace"><strong>#${b.id}</strong></td>
              <td>${b.vendor_name}${b.vendor_code ? '<br><small style="color:var(--muted)">' + b.vendor_code + '</small>' : ''}</td>
              <td>${b.memo_number || '—'}</td>
              <td style="font-family:monospace">৳${num(b.total)}</td>
              <td style="font-family:monospace">৳${num(b.discount)}</td>
              <td style="font-family:monospace;color:var(--accent2)">৳${num(b.paid_amount)}</td>
              <td style="font-family:monospace;color:var(--danger)">৳${num(b.due_amount)}</td>
              <td style="color:var(--muted); font-size:12px">${fmtDate(b.purchase_date)}${b.created_by_name ? '<br>' + b.created_by_name : ''}</td>
              <td>${statusBadge(b.status)}</td>
              <td style="white-space:nowrap">
                ${Number(b.due_amount) > 0 ? `<button class="btn btn-success btn-sm" onclick="event.stopPropagation(); collectVendorPayment(${b.id})">৳ পেমেন্ট দিন</button>` : ''}
                <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); deleteBill(${b.id})" style="color:var(--danger)">🗑️ মুছুন</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>`;

    loadSummary();
  } catch (e) {
    w.innerHTML = `<div class="empty-state" style="padding:40px 20px;"><div class="empty-icon">⚠️</div><h3>লোড হয়নি</h3></div>`;
  }
}

async function deleteBill(id) {
  const ok = await confirmModal(`বিল #${id} মুছে ফেলতে চান?\n\nএর সাথে যুক্ত স্টক ও ক্যাশ হিসাব রিভার্স হয়ে যাবে। এই কাজটি বাতিল করা যাবে না।`, { danger: true });
  if (!ok) return;
  try {
    await api(`/purchase/bills/${id}/`, 'DELETE');
    toast('বিল মুছে ফেলা হয়েছে।');
    loadBills();
  } catch (e) {
    const msg = e && typeof e === 'object' ? (e.error || e.detail || JSON.stringify(e)) : String(e);
    toast('মুছে ফেলা যায়নি: ' + msg, 'error');
  }
}

async function collectVendorPayment(billId) {
  const bill = billsCache.find(x => x.id === billId);
  if (!bill) return;
  const maxAmount = bill.due_amount;

  const itemsSummary = (bill.items || [])
    .map(i => `${i.book_title} × ${i.quantity}`)
    .join(', ');

  let html = `
    <div id="payment-modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000">
      <div class="form-card" style="width:420px; padding:24px">
        <h3 style="margin-bottom:12px">💰 ভেন্ডর পেমেন্ট দিন</h3>
        <div style="background:var(--surface2); border-radius:10px; padding:10px 12px; margin-bottom:16px; font-size:12.5px; line-height:1.6">
          <div><strong>বিল #${bill.id}</strong>${bill.memo_number ? ' — মেমো: ' + bill.memo_number : ''}</div>
          <div style="color:var(--text2)"><strong>ভেন্ডর:</strong> ${bill.vendor_name}</div>
          <div style="color:var(--text2)"><strong>তারিখ:</strong> ${fmtDate(bill.purchase_date)}</div>
          ${itemsSummary ? `<div style="color:var(--text2); margin-top:4px"><strong>বই:</strong> ${itemsSummary}</div>` : ''}
        </div>
        <p style="font-size:13px; color:var(--muted); margin-bottom:16px">এই বিলের মোট বাকি: <strong>৳${num(maxAmount)}</strong></p>

        <div class="form-group">
          <label>পরিশোধের পরিমাণ (Amount)</label>
          <input type="number" id="pay-amount" value="${maxAmount}" max="${maxAmount}" min="1" style="width:100%">
        </div>

        <div class="form-group" style="margin-top:12px">
          <label>পেমেন্ট মেথড</label>
          <select id="pay-method" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border)">
            <option value="cash">Cash (নগদ)</option>
            <option value="bkash">bKash (বিকাশ)</option>
            <option value="nagad">Nagad (নগদ)</option>
            <option value="bank">Bank (ব্যাংক)</option>
          </select>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px">
          <button class="btn btn-ghost" onclick="document.getElementById('payment-modal').remove()">বাতিল</button>
          <button class="btn btn-success" id="confirm-pay-btn">পেমেন্ট কনফার্ম</button>
        </div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', html);
  const modalEl = document.getElementById('payment-modal');
  wireModalDismiss(modalEl, () => modalEl.remove());

  document.getElementById('confirm-pay-btn').onclick = async () => {
    const amount = document.getElementById('pay-amount').value;
    const method = document.getElementById('pay-method').value;

    if (!amount || amount <= 0 || amount > maxAmount) {
      toast('সঠিক পরিমাণ লিখুন (বকেয়ার বেশি হওয়া যাবে না)', 'error');
      return;
    }

    try {
      await api(`/purchase/bills/${billId}/add_payment/`, 'POST', { amount, method });
      toast('পেমেন্ট সফলভাবে জমা হয়েছে ✓');
      modalEl.remove();
      loadBills();
    } catch (e) {
      const msg = e && typeof e === 'object' ? (e.error || e.detail || JSON.stringify(e)) : String(e);
      toast('পেমেন্ট জমা নেওয়া যায়নি: ' + msg, 'error');
    }
  };
}

function setText(id, v) { const el = document.getElementById(id); if (el) el.textContent = v; }

document.addEventListener('DOMContentLoaded', loadBills);
</script>
{% endblock %}
